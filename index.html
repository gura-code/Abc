<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Air Canvas - Fluido e Preciso</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #111;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        .input_video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
            opacity: 0.15;
            z-index: 1;
        }

        #paint_canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
        }

        #output_canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 3;
            pointer-events: none;
        }

        #instruction {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 14px;
            letter-spacing: 2px;
            color: #00ffcc;
            background: rgba(0, 0, 0, 0.8);
            padding: 8px 16px;
            border: 1px solid #00ffcc;
            border-radius: 4px;
            z-index: 10;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="instruction">INDICE PER MUOVERTI • PIZZICO PER DISEGNO FLUIDO • TOCCA I COLORI A SINISTRA</div>

    <video class="input_video" autoplay playsinline muted></video>
    <canvas id="paint_canvas"></canvas>
    <canvas id="output_canvas"></canvas>

    <script>
        const videoElement = document.querySelector('.input_video');
        const paintCanvas = document.getElementById('paint_canvas');
        const paintCtx = paintCanvas.getContext('2d');
        const outputCanvas = document.getElementById('output_canvas');
        const outputCtx = outputCanvas.getContext('2d');

        function resizeCanvases() {
            paintCanvas.width = window.innerWidth;
            paintCanvas.height = window.innerHeight;
            outputCanvas.width = window.innerWidth;
            outputCanvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvases);
        resizeCanvases();

        const palette = [
            { name: "Rosso", color: "#ff3333", x: 40, y: 50, size: 40 },
            { name: "Arancione", color: "#ff9900", x: 40, y: 110, size: 40 },
            { name: "Giallo", color: "#ffff33", x: 40, y: 170, size: 40 },
            { name: "Verde", color: "#33cc33", x: 40, y: 230, size: 40 },
            { name: "Blu", color: "#3333ff", x: 40, y: 290, size: 40 },
            { name: "Viola", color: "#9933ff", x: 40, y: 350, size: 40 },
            { name: "Bianco", color: "#ffffff", x: 40, y: 410, size: 40 },
            { name: "Gomma", color: "#000000", x: 40, y: 470, size: 40, isEraser: true }
        ];

        let currentColor = "#ff3333";
        let isEraserActive = false;
        let brushSize = 8;
        
        // Variabili per la fluidità (Smoothing / Lerp)
        let smoothX = null;
        let smoothY = null;
        let lastX = null;
        let lastY = null;
        let isDrawing = false;

        function onResults(results) {
            outputCtx.save();
            outputCtx.clearRect(0, 0, outputCanvas.width, outputCanvas.height);

            // Disegna la palette a sinistra
            palette.forEach(item => {
                outputCtx.beginPath();
                outputCtx.arc(item.x, item.y, item.size / 2, 0, Math.PI * 2);
                outputCtx.fillStyle = item.color;
                outputCtx.fill();
                outputCtx.lineWidth = 3;
                outputCtx.strokeStyle = (currentColor === item.color || (item.isEraser && isEraserActive)) ? "#00ffcc" : "#ffffff";
                outputCtx.stroke();
                outputCtx.closePath();

                outputCtx.fillStyle = "#ffffff";
                outputCtx.font = "11px Courier New";
                outputCtx.fillText(item.name, item.x + 35, item.y + 4);
            });

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const landmarks = results.multiHandLandmarks[0];

                // CORREZIONE ASSE X: rimosso l'inversione speculare per allinearlo perfettamente al canvas non specchiato
                const rawX = landmarks[8].x * window.innerWidth;
                const rawY = landmarks[8].y * window.innerHeight;
                const thumbX = landmarks[4].x * window.innerWidth;
                const thumbY = landmarks[4].y * window.innerHeight;

                // Smoothing (Lerp) per evitare scatti e rendere il cursore fluidissimo
                if (smoothX === null || smoothY === null) {
                    smoothX = rawX;
                    smoothY = rawY;
                } else {
                    smoothX += (rawX - smoothX) * 0.35; // Regola la reattività (0.1 = morbido, 0.9 = reattivo)
                    smoothY += (rawY - smoothY) * 0.35;
                }

                const pinchDist = Math.hypot(smoothX - thumbX, smoothY - thumbY);
                const isPinched = pinchDist < 45; // Soglia comoda per il pizzico

                // Disegna il cursore sulla punta dell'indice
                outputCtx.beginPath();
                outputCtx.arc(smoothX, smoothY, 8, 0, Math.PI * 2);
                outputCtx.fillStyle = isPinched ? "#00ffcc" : currentColor;
                outputCtx.fill();
                outputCtx.lineWidth = 2;
                outputCtx.strokeStyle = "#ffffff";
                outputCtx.stroke();

                // Controllo selezione colori
                let selectingColor = false;
                palette.forEach(item => {
                    const distToPalette = Math.hypot(smoothX - item.x, smoothY - item.y);
                    if (distToPalette < item.size / 2) {
                        selectingColor = true;
                        if (isPinched) {
                            if (item.isEraser) {
                                isEraserActive = true;
                            } else {
                                isEraserActive = false;
                                currentColor = item.color;
                            }
                        }
                    }
                });

                // Gestione del tratto di disegno continuo e senza buchi
                if (isPinched && !selectingColor) {
                    if (!isDrawing) {
                        isDrawing = true;
                        lastX = smoothX;
                        lastY = smoothY;
                    } else {
                        paintCtx.beginPath();
                        paintCtx.moveTo(lastX, lastY);
                        paintCtx.lineTo(smoothX, smoothY);
                        
                        if (isEraserActive) {
                            paintCtx.strokeStyle = "#000000";
                            paintCtx.lineWidth = 40;
                            paintCtx.globalCompositeOperation = "destination-out"; // Cancella
                        } else {
                            paintCtx.strokeStyle = currentColor;
                            paintCtx.lineWidth = brushSize;
                            paintCtx.globalCompositeOperation = "source-over"; // Disegna
                        }
                        
                        paintCtx.lineCap = "round";
                        paintCtx.lineJoin = "round";
                        paintCtx.stroke();
                        paintCtx.closePath();

                        lastX = smoothX;
                        lastY = smoothY;
                    }
                } else {
                    isDrawing = false;
                    lastX = null;
                    lastY = null;
                }

            } else {
                isDrawing = false;
                smoothX = null;
                smoothY = null;
            }

            outputCtx.restore();
        }

        const hands = new Hands({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
        });

        hands.setOptions({
            maxNumHands: 1,
            modelComplexity: 1,
            minDetectionConfidence: 0.75,
            minTrackingConfidence: 0.75
        });

        hands.onResults(onResults);

        const camera = new Camera(videoElement, {
            onFrame: async () => {
                await hands.send({ image: videoElement });
            },
            width: 1280,
            height: 720,
            facingMode: 'user'
        });
        camera.start();
    </script>
</body>
</html>

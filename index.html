<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COSMIC-S // Full Body System v4</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>

    <style>
        :root {
            --bg-color: #0E0E0E;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            position: relative;
            width: 100%;
            height: 100%;
            background: #000;
        }

        video {
            display: none;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transform: scaleX(-1); /* Specchio per movimento naturale */
        }
    </style>
</head>
<body>

    <div class="container">
        <video id="webcam" autoplay playsinline></video>
        <canvas id="canvas"></canvas>
    </div>

    <script>
        const videoElement = document.getElementById('webcam');
        const canvasElement = document.getElementById('canvas');
        const canvasCtx = canvasElement.getContext('2d');

        // Unico bersaglio attivo alla volta
        let currentTarget = { x: 0, y: 0, radius: 45, type: 'left', color: '#00E5FF', label: 'MANO SX' };
        let particles = [];

        function resizeCanvas() {
            canvasElement.width = window.innerWidth;
            canvasElement.height = window.innerHeight;
            spawnNewTarget();
        }
        window.addEventListener('resize', resizeCanvas);

        function spawnNewTarget() {
            const w = canvasElement.width;
            const h = canvasElement.height;

            // Scegli casualmente se colpire con Mano Sinistra (15), Mano Destra (16) o Testa (0)
            const types = [
                { type: 'left', color: '#00E5FF', landmark: 15, label: 'MANO SX' },
                { type: 'right', color: '#FF3366', landmark: 16, label: 'MANO DX' },
                { type: 'head', color: '#00FF66', landmark: 0, label: 'TESTA' }
            ];

            const chosen = types[Math.floor(Math.random() * types.length)];
            
            currentTarget = {
                x: Math.random() * (w * 0.6) + (w * 0.2),
                y: Math.random() * (h * 0.5) + 120,
                radius: 45,
                type: chosen.type,
                color: chosen.color,
                landmark: chosen.landmark,
                label: chosen.label
            };
        }

        function onResults(results) {
            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

            // Disegna webcam a schermo intero
            canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

            if (results.poseLandmarks) {
                drawAdvancedSkeleton(results.poseLandmarks);

                // Controlla l'interazione solo con il bersaglio attualmente attivo sullo schermo
                const activeLandmark = results.poseLandmarks[currentTarget.landmark];
                checkInteraction(activeLandmark, currentTarget);
            }

            drawActiveTarget();
            updateAndDrawParticles();

            canvasCtx.restore();
        }

        function drawAdvancedSkeleton(landmarks) {
            const w = canvasElement.width;
            const h = canvasElement.height;

            const connections = [
                [11, 12], [11, 13], [13, 15], [12, 14], [14, 16], // Braccia
                [11, 23], [12, 24], [23, 24],                    // Torso
                [23, 25], [25, 27], [24, 26], [26, 28]           // Gambe
            ];

            canvasCtx.strokeStyle = 'rgba(0, 255, 102, 0.4)';
            canvasCtx.lineWidth = 3;

            connections.forEach(([i, j]) => {
                const p1 = landmarks[i];
                const p2 = landmarks[j];
                if (p1.visibility > 0.5 && p2.visibility > 0.5) {
                    canvasCtx.beginPath();
                    canvasCtx.moveTo(p1.x * w, p1.y * h);
                    canvasCtx.lineTo(p2.x * w, p2.y * h);
                    canvasCtx.stroke();
                }
            });
        }

        function drawActiveTarget() {
            const w = canvasElement.width;
            const h = canvasElement.height;

            // Disegna il cerchio principale
            canvasCtx.strokeStyle = currentTarget.color;
            canvasCtx.lineWidth = 5;
            canvasCtx.beginPath();
            canvasCtx.arc(currentTarget.x, currentTarget.y, currentTarget.radius, 0, 2 * Math.PI);
            canvasCtx.stroke();
            
            canvasCtx.fillStyle = currentTarget.color === '#00E5FF' ? 'rgba(0, 229, 255, 0.3)' :
                                  currentTarget.color === '#FF3366' ? 'rgba(255, 51, 102, 0.3)' : 
                                                                      'rgba(0, 255, 102, 0.3)';
            canvasCtx.fill();

            // Scritta grande al centro del bersaglio in modo che si legga anche da lontano
            canvasCtx.save();
            canvasCtx.scale(-1, 1); // Raddrizza il testo ribaltato dallo specchio della webcam
            canvasCtx.font = 'bold 14px "Space Grotesk", sans-serif';
            canvasCtx.fillStyle = '#FFFFFF';
            canvasCtx.textAlign = 'center';
            canvasCtx.textBaseline = 'middle';
            canvasCtx.fillText(currentTarget.label, -currentTarget.x, currentTarget.y);
            canvasCtx.restore();
        }

        function checkInteraction(bodyPart, target) {
            if (!bodyPart || bodyPart.visibility < 0.5) return;

            const w = canvasElement.width;
            const h = canvasElement.height;
            const pX = bodyPart.x * w;
            const pY = bodyPart.y * h;

            const dist = Math.hypot(pX - target.x, pY - target.y);

            if (dist < target.radius + 15) {
                createParticles(target.x, target.y, target.color);
                spawnNewTarget(); // Crea subito un nuovo bersaglio casuale
            }
        }

        function createParticles(x, y, color) {
            for (let i = 0; i < 20; i++) {
                particles.push({
                    x: x, y: y,
                    vx: (Math.random() - 0.5) * 12,
                    vy: (Math.random() - 0.5) * 12,
                    alpha: 1,
                    color: color
                });
            }
        }

        function updateAndDrawParticles() {
            particles.forEach((p, index) => {
                p.x += p.vx;
                p.y += p.vy;
                p.alpha -= 0.03;

                if (p.alpha <= 0) {
                    particles.splice(index, 1);
                } else {
                    canvasCtx.save();
                    canvasCtx.globalAlpha = p.alpha;
                    canvasCtx.fillStyle = p.color;
                    canvasCtx.beginPath();
                    canvasCtx.arc(p.x, p.y, 5, 0, 2 * Math.PI);
                    canvasCtx.fill();
                    canvasCtx.restore();
                }
            });
        }

        const pose = new Pose({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
        });

        pose.setOptions({
            modelComplexity: 1,
            smoothLandmarks: true,
            enableSegmentation: false,
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
        });

        pose.onResults(onResults);

        const camera = new Camera(videoElement, {
            onFrame: async () => {
                await pose.send({ image: videoElement });
            },
            width: 1280,
            height: 720
        });
        camera.start();

        setTimeout(resizeCanvas, 500);
    </script>
</body>
</html>

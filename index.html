<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COSMIC-S // Full Body System v3</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>

    <style>
        :root {
            --bg-color: #0E0E0E;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            position: relative;
            width: 100%;
            height: 100%;
            background: #000;
        }

        video {
            display: none;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transform: scaleX(-1); /* Specchio per il movimento naturale */
        }
    </style>
</head>
<body>

    <div class="container">
        <video id="webcam" autoplay playsinline></video>
        <canvas id="canvas"></canvas>
    </div>

    <script>
        const videoElement = document.getElementById('webcam');
        const canvasElement = document.getElementById('canvas');
        const canvasCtx = canvasElement.getContext('2d');

        // Bersagli: Mano SX (Ciano), Mano DX (Rosa), Testa (Verde)
        let targetLeft = { x: 300, y: 300, radius: 40, color: '#00E5FF' };
        let targetRight = { x: 800, y: 300, radius: 40, color: '#FF3366' };
        let targetHead = { x: 600, y: 200, radius: 35, color: '#00FF66' };

        let particles = [];

        function resizeCanvas() {
            canvasElement.width = window.innerWidth;
            canvasElement.height = window.innerHeight;
            resetTargets();
        }
        window.addEventListener('resize', resizeCanvas);

        function resetTargets() {
            const w = canvasElement.width;
            const h = canvasElement.height;
            // Posizioni logiche corrette (Mano sinistra a sinistra, mano destra a destra)
            targetLeft.x = Math.random() * (w * 0.35) + 80;
            targetLeft.y = Math.random() * (h * 0.5) + 150;

            targetRight.x = Math.random() * (w * 0.35) + (w * 0.6);
            targetRight.y = Math.random() * (h * 0.5) + 150;

            targetHead.x = Math.random() * (w * 0.4) + (w * 0.3);
            targetHead.y = Math.random() * (h * 0.3) + 100;
        }

        function onResults(results) {
            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

            // Disegna la webcam a schermo intero
            canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

            if (results.poseLandmarks) {
                drawAdvancedSkeleton(results.poseLandmarks);

                // Landmark 15 = Mano Sinistra, 16 = Mano Destra, 0 = Naso/Testa
                checkInteraction(results.poseLandmarks[15], targetLeft);
                checkInteraction(results.poseLandmarks[16], targetRight);
                checkInteraction(results.poseLandmarks[0], targetHead);
            }

            drawTargets();
            updateAndDrawParticles();

            canvasCtx.restore();
        }

        function drawAdvancedSkeleton(landmarks) {
            const w = canvasElement.width;
            const h = canvasElement.height;

            const connections = [
                [11, 12], [11, 13], [13, 15], [12, 14], [14, 16], // Braccia
                [11, 23], [12, 24], [23, 24],                    // Torso
                [23, 25], [25, 27], [24, 26], [26, 28]           // Gambe
            ];

            canvasCtx.strokeStyle = 'rgba(0, 255, 102, 0.6)';
            canvasCtx.lineWidth = 4;

            connections.forEach(([i, j]) => {
                const p1 = landmarks[i];
                const p2 = landmarks[j];
                if (p1.visibility > 0.5 && p2.visibility > 0.5) {
                    canvasCtx.beginPath();
                    canvasCtx.moveTo(p1.x * w, p1.y * h);
                    canvasCtx.lineTo(p2.x * w, p2.y * h);
                    canvasCtx.stroke();
                }
            });

            landmarks.forEach((p, idx) => {
                if (p.visibility > 0.5 && idx >= 11) {
                    canvasCtx.fillStyle = '#FFFFFF';
                    canvasCtx.beginPath();
                    canvasCtx.arc(p.x * w, p.y * h, 4, 0, 2 * Math.PI);
                    canvasCtx.fill();
                }
            });
        }

        function drawTargets() {
            [targetLeft, targetRight, targetHead].forEach(t => {
                canvasCtx.strokeStyle = t.color;
                canvasCtx.lineWidth = 4;
                canvasCtx.beginPath();
                canvasCtx.arc(t.x, t.y, t.radius, 0, 2 * Math.PI);
                canvasCtx.stroke();
                
                canvasCtx.fillStyle = t.color === '#00E5FF' ? 'rgba(0, 229, 255, 0.25)' :
                                      t.color === '#FF3366' ? 'rgba(255, 51, 102, 0.25)' : 
                                                              'rgba(0, 255, 102, 0.25)';
                canvasCtx.fill();
            });
        }

        function checkInteraction(bodyPart, target) {
            if (!bodyPart || bodyPart.visibility < 0.5) return;

            const w = canvasElement.width;
            const h = canvasElement.height;
            const pX = bodyPart.x * w;
            const pY = bodyPart.y * h;

            const dist = Math.hypot(pX - target.x, pY - target.y);

            if (dist < target.radius + 20) {
                createParticles(target.x, target.y, target.color);
                // Sposta il bersaglio colpito in una nuova posizione casuale
                target.x = Math.random() * (w * 0.7) + (w * 0.15);
                target.y = Math.random() * (h * 0.6) + 100;
            }
        }

        function createParticles(x, y, color) {
            for (let i = 0; i < 18; i++) {
                particles.push({
                    x: x, y: y,
                    vx: (Math.random() - 0.5) * 10,
                    vy: (Math.random() - 0.5) * 10,
                    alpha: 1,
                    color: color
                });
            }
        }

        function updateAndDrawParticles() {
            particles.forEach((p, index) => {
                p.x += p.vx;
                p.y += p.vy;
                p.alpha -= 0.035;

                if (p.alpha <= 0) {
                    particles.splice(index, 1);
                } else {
                    canvasCtx.save();
                    canvasCtx.globalAlpha = p.alpha;
                    canvasCtx.fillStyle = p.color;
                    canvasCtx.beginPath();
                    canvasCtx.arc(p.x, p.y, 5, 0, 2 * Math.PI);
                    canvasCtx.fill();
                    canvasCtx.restore();
                }
            });
        }

        const pose = new Pose({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
        });

        pose.setOptions({
            modelComplexity: 1,
            smoothLandmarks: true,
            enableSegmentation: false,
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
        });

        pose.onResults(onResults);

        const camera = new Camera(videoElement, {
            onFrame: async () => {
                await pose.send({ image: videoElement });
            },
            width: 1280,
            height: 720
        });
        camera.start();

        setTimeout(resizeCanvas, 500);
    </script>
</body>
</html>

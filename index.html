<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retrolens 3D Hand Mesh - TikTok Trend</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            color: #00ffcc;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        .hud-top {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(10, 10, 10, 0.85);
            border: 1px solid rgba(0, 255, 204, 0.4);
            padding: 12px 18px;
            border-radius: 6px;
            z-index: 20;
            pointer-events: auto;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.2);
        }

        h4 { margin: 0 0 8px 0; font-size: 13px; color: #ff007f; letter-spacing: 1px; }
        .filter-btn {
            background: rgba(0, 255, 204, 0.1);
            border: 1px solid #00ffcc;
            color: #00ffcc;
            padding: 5px 10px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 11px;
            cursor: pointer;
            border-radius: 3px;
            margin-right: 4px;
            margin-bottom: 4px;
        }
        .filter-btn:hover, .filter-btn.active {
            background: #00ffcc;
            color: #000;
            font-weight: bold;
        }

        .input_video {
            display: none;
        }

        #output_canvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            transform: scaleX(-1);
            z-index: 2;
        }
    </style>
</head>
<body>

    <div class="hud-top">
        <h4>RETROLENS 3D PORTAL FX</h4>
        <div id="status-text" style="font-size: 11px; margin-bottom: 8px; color: #fff;">MODALITÀ: <span style="color: #00ffcc;">FINESTRA A COLORI</span></div>
        <div>
            <button class="filter-btn active" onclick="setMode('portal')">Finestra Colore</button>
            <button class="filter-btn" onclick="setMode('inverted')">Portale Inverso</button>
            <button class="filter-btn" onclick="setMode('neon')">Neon Cyber</button>
        </div>
    </div>

    <video class="input_video" autoplay playsinline muted></video>
    <canvas id="output_canvas"></canvas>

    <script>
        const videoElement = document.querySelector('.input_video');
        const canvasElement = document.getElementById('output_canvas');
        const canvasCtx = canvasElement.getContext('2d');

        let currentMode = 'portal';

        function setMode(mode) {
            currentMode = mode;
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            let desc = mode === 'portal' ? 'Finestra Colore' : (mode === 'inverted' ? 'Portale Inverso' : 'Neon Cyber');
            document.getElementById('status-text').innerHTML = `MODALITÀ: <span style="color: #00ffcc;">${desc.toUpperCase()}</span>`;
        }

        function resizeCanvas() {
            canvasElement.width = window.innerWidth;
            canvasElement.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function onResults(results) {
            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

            if (!results.image) {
                canvasCtx.restore();
                return;
            }

            // 1. Sfondo generale in bianco e nero ad alto contrasto
            canvasCtx.filter = 'grayscale(100%) contrast(140%) brightness(80%)';
            canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);
            canvasCtx.filter = 'none';

            // 2. Se ci sono entrambe le mani, creiamo il portale agganciato alle punte delle dita
            if (results.multiHandLandmarks && results.multiHandLandmarks.length >= 2) {
                const h1 = results.multiHandLandmarks[0];
                const h2 = results.multiHandLandmarks[1];

                // Punte delle dita esatte: Indice (8) e Mignolo (20) o Polso per base
                // Usiamo l'indice (8) e il mignolo (20) di entrambe le mani per fare un rettangolo perfetto tra le punte
                const p1_top = { x: (1 - h1[8].x) * canvasElement.width, y: h1[8].y * canvasElement.height };
                const p1_bottom = { x: (1 - h1[20].x) * canvasElement.width, y: h1[20].y * canvasElement.height };
                
                const p2_top = { x: (1 - h2[8].x) * canvasElement.width, y: h2[8].y * canvasElement.height };
                const p2_bottom = { x: (1 - h2[20].x) * canvasElement.width, y: h2[20].y * canvasElement.height };

                canvasCtx.save();
                canvasCtx.beginPath();
                canvasCtx.moveTo(p1_top.x, p1_top.y);
                canvasCtx.lineTo(p2_top.x, p2_top.y);
                canvasCtx.lineTo(p2_bottom.x, p2_bottom.y);
                canvasCtx.lineTo(p1_bottom.x, p1_bottom.y);
                canvasCtx.closePath();

                // Ritaglia la mesh per mostrare i colori originali (o il filtro) solo al suo interno
                canvasCtx.clip();

                // Disegna l'immagine a colori originali dentro il portale
                if (currentMode === 'portal') {
                    canvasCtx.filter = 'saturate(180%) contrast(120%)';
                } else if (currentMode === 'inverted') {
                    canvasCtx.filter = 'invert(100%) saturate(200%)';
                } else if (currentMode === 'neon') {
                    canvasCtx.filter = 'hue-rotate(120deg) saturate(300%) contrast(150%)';
                }
                
                canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);
                canvasCtx.restore();

                // 3. Cornice wireframe luminosa e futuristica attorno alla mesh delle dita
                canvasCtx.strokeStyle = '#00ffcc';
                canvasCtx.lineWidth = 3;
                canvasCtx.shadowBlur = 18;
                canvasCtx.shadowColor = '#00ffcc';
                canvasCtx.beginPath();
                canvasCtx.moveTo(p1_top.x, p1_top.y);
                canvasCtx.lineTo(p2_top.x, p2_top.y);
                canvasCtx.lineTo(p2_bottom.x, p2_bottom.y);
                canvasCtx.lineTo(p1_bottom.x, p1_bottom.y);
                canvasCtx.closePath();
                canvasCtx.stroke();

                // Disegna i punti di tracking sulle mani per un look super tecnologico
                [h1, h2].forEach(hand => {
                    drawConnectors(canvasCtx, hand, HAND_CONNECTIONS, {color: 'rgba(0, 255, 204, 0.5)', lineWidth: 1});
                    drawLandmarks(canvasCtx, hand, {color: '#ff007f', lineWidth: 1, radius: 2});
                });

            } else {
                // Messaggio guida se c'è una sola mano
                canvasCtx.fillStyle = '#00ffcc';
                canvasCtx.font = '15px Courier New';
                canvasCtx.textAlign = 'center';
                canvasCtx.shadowBlur = 10;
                canvasCtx.shadowColor = '#00ffcc';
                canvasCtx.fillText("AVVICINA ENTRAMBE LE MANI PER APRIRE IL PORTALE", canvasElement.width / 2, canvasElement.height - 50);
            }

            canvasCtx.restore();
        }

        const hands = new Hands({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
        });

        hands.setOptions({
            maxNumHands: 2,
            modelComplexity: 1,
            minDetectionConfidence: 0.65,
            minTrackingConfidence: 0.65
        });

        hands.onResults(onResults);

        const camera = new Camera(videoElement, {
            onFrame: async () => {
                await hands.send({ image: videoElement });
            },
            width: 1280,
            height: 720,
            facingMode: 'user'
        });
        camera.start();
    </script>
</body>
</html>

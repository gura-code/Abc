<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COSMIC-S // Interactive Fireworks</title>
    
    <!-- Google Fonts & MediaPipe Hands -->
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <style>
        :root {
            --bg-color: #0E0E0E;
            --accent-color: #00FF66;
            --text-color: #F0F0F0;
            --panel-bg: rgba(20, 20, 20, 0.85);
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Space Grotesk', sans-serif;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            position: relative;
            width: 100%;
            height: 100%;
            background: #000;
        }

        video {
            display: none;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transform: scaleX(-1); /* Effetto specchio */
        }

        .hud {
            position: absolute;
            top: 20px;
            left: 20px;
            background: var(--panel-bg);
            padding: 12px 20px;
            border-radius: 8px;
            border: 1px solid #333;
            backdrop-filter: blur(5px);
            z-index: 10;
        }

        .hud h1 {
            margin: 0 0 5px 0;
            font-size: 16px;
            letter-spacing: 1px;
            color: var(--accent-color);
        }

        .hud p {
            margin: 0;
            font-size: 14px;
            color: #AAA;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="hud">
            <h1>COSMIC-S // FIREWORKS</h1>
            <p>Stato: <span id="status">In attesa della mano...</span></p>
        </div>

        <video id="webcam" autoplay playsinline></video>
        <canvas id="canvas"></canvas>
    </div>

    <script>
        const videoElement = document.getElementById('webcam');
        const canvasElement = document.getElementById('canvas');
        const canvasCtx = canvasElement.getContext('2d');
        const statusEl = document.getElementById('status');

        let fireworks = [];
        let particles = [];
        let lastX = 0;
        let lastY = 0;

        function resizeCanvas() {
            canvasElement.width = window.innerWidth;
            canvasElement.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Firework {
            constructor(x, y, targetX, targetY, color) {
                this.x = x;
                this.y = y;
                this.targetX = targetX;
                this.targetY = targetY;
                this.distanceToTarget = Math.hypot(targetX - x, targetY - y);
                this.distanceTraveled = 0;
                this.coordinates = [];
                this.coordinateCount = 3;
                while (this.coordinateCount--) {
                    this.coordinates.push([this.x, this.y]);
                }
                this.angle = Math.atan2(targetY - y, targetX - x);
                this.speed = 12;
                this.acceleration = 1.05;
                this.brightness = Math.random() * 50 + 50;
                this.color = color;
            }

            update(index) {
                this.coordinates.pop();
                this.coordinates.unshift([this.x, this.y]);
                this.speed *= this.acceleration;
                
                let vx = Math.cos(this.angle) * this.speed;
                let vy = Math.sin(this.angle) * this.speed;
                this.distanceTraveled = Math.hypot(targetX - this.x, targetY - this.y); // semplificato

                this.x += vx;
                this.y += vy;
            }

            draw() {
                canvasCtx.beginPath();
                canvasCtx.moveTo(this.coordinates[this.coordinates.length - 1][0], this.coordinates[this.coordinates.length - 1][1]);
                canvasCtx.lineTo(this.x, this.y);
                canvasCtx.strokeStyle = this.color;
                canvasCtx.stroke();
            }
        }

        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.coordinates = [];
                this.coordinateCount = 5;
                while (this.coordinateCount--) {
                    this.coordinates.push([this.x, this.y]);
                }
                this.angle = Math.random() * Math.PI * 2;
                this.speed = Math.random() * 10 + 2;
                this.friction = 0.95;
                this.gravity = 1;
                this.hue = Math.random() * 360;
                this.brightness = Math.random() * 50 + 50;
                this.alpha = 1;
                this.decay = Math.random() * 0.015 + 0.015;
                this.color = color;
            }

            update(index) {
                this.coordinates.pop();
                this.coordinates.unshift([this.x, this.y]);
                this.speed *= this.friction;
                this.x += Math.cos(this.angle) * this.speed;
                this.y += Math.sin(this.angle) * this.speed + this.gravity;
                this.alpha -= this.decay;

                if (this.alpha <= this.decay) {
                    particles.splice(index, 1);
                }
            }

            draw() {
                canvasCtx.save();
                canvasCtx.globalAlpha = this.alpha;
                canvasCtx.beginPath();
                canvasCtx.moveTo(this.coordinates[this.coordinates.length - 1][0], this.coordinates[this.coordinates.length - 1][1]);
                canvasCtx.lineTo(this.x, this.y);
                canvasCtx.strokeStyle = this.color;
                canvasCtx.stroke();
                canvasCtx.restore();
            }
        }

        function createParticles(x, y) {
            let particleCount = 40;
            let colors = ['#00FF66', '#00E5FF', '#FF3366', '#FFCC00', '#FFFFFF'];
            let randomColor = colors[Math.floor(Math.random() * colors.length)];
            while (particleCount--) {
                particles.push(new Particle(x, y, randomColor));
            }
        }

        function onResults(results) {
            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

            // Disegna il flusso della webcam con trasparenza per lasciare la scia
            canvasCtx.globalAlpha = 0.25;
            canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);
            canvasCtx.globalAlpha = 1.0;

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                statusEl.innerText = "Mano rilevata // Fuochi attivi";
                statusEl.style.color = "#00FF66";

                // Prendi la punta del dito indice (landmark 8)
                const indexFinger = results.multiHandLandmarks[0][8];
                const x = indexFinger.x * canvasElement.width;
                const y = indexFinger.y * canvasElement.height;

                // Se la mano si muove abbastanza, genera particelle/scintille
                let dist = Math.hypot(x - lastX, y - lastY);
                if (dist > 15) {
                    createParticles(x, y);
                    lastX = x;
                    lastY = y;
                }
            } else {
                statusEl.innerText = "Mostra la mano alla fotocamera...";
                statusEl.style.color = "#FF3366";
            }

            // Aggiorna e disegna le particelle
            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].draw();
                particles[i].update(i);
            }

            canvasCtx.restore();
        }

        const hands = new Hands({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
        });

        hands.setOptions({
            maxNumHands: 1,
            modelComplexity: 1,
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
        });

        hands.onResults(onResults);

        const camera = new Camera(videoElement, {
            onFrame: async () => {
                await hands.send({ image: videoElement });
            },
            width: 1280,
            height: 720
        });
        camera.start();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retrolens Pro Customizer FX</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #050505;
            color: #00ffcc;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Container principale che simula il mirino nativo della fotocamera senza deformare */
        #viewfinder-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.3s ease;
        }

        #output_canvas {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover; /* Taglio pulito stile fotocamera nativa */
            transform: scaleX(-1);
            z-index: 2;
        }

        .hud-top {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(14, 14, 14, 0.92);
            border: 1px solid rgba(0, 255, 204, 0.4);
            padding: 12px;
            border-radius: 8px;
            z-index: 20;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.2);
            max-width: 300px;
            transform: scaleX(1);
        }

        h4 { margin: 0 0 8px 0; font-size: 13px; color: #ff007f; letter-spacing: 1px; }
        
        .control-group {
            margin-bottom: 8px;
        }

        .control-group label {
            display: block;
            font-size: 9px;
            color: #aaa;
            margin-bottom: 2px;
        }

        .filter-btn, .option-btn, #manual-download-btn {
            background: rgba(0, 255, 204, 0.1);
            border: 1px solid #00ffcc;
            color: #00ffcc;
            padding: 3px 6px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 9px;
            cursor: pointer;
            border-radius: 3px;
            margin-right: 2px;
            margin-bottom: 2px;
        }
        .filter-btn:hover, .filter-btn.active, .option-btn:hover, .option-btn.active {
            background: #00ffcc;
            color: #000;
            font-weight: bold;
        }

        #manual-download-btn {
            display: none;
            width: 100%;
            background: #ff007f;
            border-color: #ff007f;
            color: #fff;
            font-weight: bold;
            margin-top: 6px;
            padding: 5px;
            text-align: center;
        }
        #manual-download-btn:hover { background: #ff3399; }

        input[type="color"] {
            border: 1px solid #00ffcc;
            width: 25px;
            height: 18px;
            background: transparent;
            cursor: pointer;
            vertical-align: middle;
        }

        #countdown-overlay {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 120px;
            font-weight: bold;
            color: #ff007f;
            text-shadow: 0 0 30px #ff007f;
            z-index: 30;
            display: none;
            pointer-events: none;
        }

        #flash-overlay {
            position: absolute;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: white;
            z-index: 40;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease-out;
        }

        .input_video { display: none; }
    </style>
</head>
<body>

    <div id="viewfinder-container">
        <div class="hud-top">
            <h4>RETROLENS PRO FX</h4>
            <div id="status-text" style="font-size: 9px; margin-bottom: 6px; color: #fff;">STATO: <span style="color: #00ffcc;">PRONTO</span></div>
            
            <div class="control-group">
                <label>FOTOCAMERA:</label>
                <button class="option-btn active" onclick="setCamera('user', this)">Frontale</button>
                <button class="option-btn" onclick="setCamera('environment', this)">Retro</button>
            </div>

            <div class="control-group">
                <label>FRAME / FORMATO:</label>
                <button class="option-btn active" onclick="setAspectRatio('full', this)">Schermo Intero</button>
                <button class="option-btn" onclick="setAspectRatio('1:1', this)">Quadrato (1:1)</button>
                <button class="option-btn" onclick="setAspectRatio('9:16', this)">Verticale (9:16)</button>
                <button class="option-btn" onclick="setAspectRatio('16:9', this)">Orizzontale (16:9)</button>
                <button class="option-btn" onclick="setAspectRatio('4:3', this)">Classico (4:3)</button>
            </div>

            <div class="control-group">
                <label>COLORE ELEMENTI:</label>
                <input type="color" id="theme-color" value="#00ffcc" onchange="accentColor = this.value">
            </div>

            <div class="control-group">
                <label>FILTRI:</label>
                <button class="filter-btn active" onclick="setMode('portal', this)">Finestra Colore</button>
                <button class="filter-btn" onclick="setMode('inverted', this)">Inverso</button>
                <button class="filter-btn" onclick="setMode('neon', this)">Neon</button>
                <button class="filter-btn" onclick="setMode('none', this)">Nessuno</button>
            </div>

            <button id="manual-download-btn" onclick="downloadImageManually()">SCARICA FOTO 💾</button>
        </div>

        <div id="countdown-overlay">3</div>
        <div id="flash-overlay"></div>

        <video class="input_video" autoplay playsinline muted></video>
        <canvas id="output_canvas"></canvas>
    </div>

    <script>
        const videoElement = document.querySelector('.input_video');
        const canvasElement = document.getElementById('output_canvas');
        const canvasCtx = canvasElement.getContext('2d');
        const countdownEl = document.getElementById('countdown-overlay');
        const flashEl = document.getElementById('flash-overlay');
        const container = document.getElementById('viewfinder-container');
        const downloadBtn = document.getElementById('manual-download-btn');

        let currentMode = 'portal';
        let currentFacingMode = 'user';
        let currentAspect = 'full';
        let accentColor = '#00ffcc';
        let isCountingDown = false;
        let cameraInstance = null;
        let lastCapturedDataUrl = null;

        function setMode(mode, btn) {
            currentMode = mode;
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            if(btn) btn.classList.add('active');
        }

        function setCamera(facing, btn) {
            currentFacingMode = facing;
            document.querySelectorAll('.control-group:nth-child(2) .option-btn').forEach(b => b.classList.remove('active'));
            if(btn) btn.classList.add('active');
            restartCamera();
        }

        function setAspectRatio(aspect, btn) {
            currentAspect = aspect;
            document.querySelectorAll('.control-group:nth-child(3) .option-btn').forEach(b => b.classList.remove('active'));
            if(btn) btn.classList.add('active');
            
            // Gestione dei frame stile fotocamera nativa senza distorsioni
            if (aspect === 'full') {
                container.style.width = '100vw';
                container.style.height = '100vh';
            } else if (aspect === '1:1') {
                const size = Math.min(window.innerWidth, window.innerHeight) * 0.85;
                container.style.width = size + 'px';
                container.style.height = size + 'px';
            } else if (aspect === '9:16') {
                container.style.height = '90vh';
                container.style.width = (window.innerHeight * 0.9 * 9 / 16) + 'px';
            } else if (aspect === '16:9') {
                container.style.width = '90vw';
                container.style.height = (window.innerWidth * 0.9 * 9 / 16) + 'px';
            } else if (aspect === '4:3') {
                container.style.width = '85vw';
                container.style.height = (window.innerWidth * 0.85 * 3 / 4) + 'px';
            }
            resizeCanvas();
        }

        function resizeCanvas() {
            canvasElement.width = container.clientWidth * window.devicePixelRatio;
            canvasElement.height = container.clientHeight * window.devicePixelRatio;
        }
        window.addEventListener('resize', () => setAspectRatio(currentAspect, null));
        resizeCanvas();

        function triggerCapture() {
            if (isCountingDown) return;
            isCountingDown = true;
            
            let count = 3;
            countdownEl.style.display = 'block';
            countdownEl.innerText = count;
            document.getElementById('status-text').innerHTML = `STATO: <span style="color: #ff007f;">ATTendi (${count})...</span>`;

            let timer = setInterval(() => {
                count--;
                if (count > 0) {
                    countdownEl.innerText = count;
                    document.getElementById('status-text').innerHTML = `STATO: <span style="color: #ff007f;">ATTendi (${count})...</span>`;
                } else {
                    clearInterval(timer);
                    countdownEl.style.display = 'none';
                    
                    flashEl.style.opacity = '1';
                    setTimeout(() => { flashEl.style.opacity = '0'; }, 300);

                    document.getElementById('status-text').innerHTML = `STATO: <span style="color: ${accentColor};">FOTO SCATTATA!</span>`;

                    setTimeout(() => {
                        lastCapturedDataUrl = canvasElement.toDataURL('image/png', 1.0);
                        
                        const link = document.createElement('a');
                        link.href = lastCapturedDataUrl;
                        link.download = `retrolens-pro-${Date.now()}.png`;
                        document.body.appendChild(link);
                        link.click();
                        document.body.removeChild(link);

                        downloadBtn.style.display = 'block';
                        isCountingDown = false;
                    }, 400);
                }
            }, 1000);
        }

        function downloadImageManually() {
            if (!lastCapturedDataUrl) return;
            const link = document.createElement('a');
            link.href = lastCapturedDataUrl;
            link.download = `retrolens-pro-${Date.now()}.png`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function onResults(results) {
            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

            if (!results.image) {
                canvasCtx.restore();
                return;
            }

            const scaleX = canvasElement.width;
            const scaleY = canvasElement.height;

            canvasCtx.filter = 'grayscale(100%) contrast(140%) brightness(80%)';
            canvasCtx.drawImage(results.image, 0, 0, scaleX, scaleY);
            canvasCtx.filter = 'none';

            if (results.multiHandLandmarks && results.multiHandLandmarks.length >= 2 && results.multiHandedness) {
                let leftHand = null;
                let rightHand = null;

                for (let i = 0; i < results.multiHandLandmarks.length; i++) {
                    const landmarks = results.multiHandLandmarks[i];
                    const avgX = landmarks.reduce((acc, pt) => acc + pt.x, 0) / landmarks.length;

                    if (avgX < 0.5) {
                        leftHand = landmarks;
                    } else {
                        rightHand = landmarks;
                    }
                }

                if (!leftHand || !rightHand) {
                    leftHand = results.multiHandLandmarks[0];
                    rightHand = results.multiHandLandmarks[1];
                }

                const distLeft = Math.hypot(leftHand[4].x - leftHand[8].x, leftHand[4].y - leftHand[8].y);
                const distRight = Math.hypot(rightHand[4].x - rightHand[8].x, rightHand[4].y - rightHand[8].y);

                const pinchThreshold = 0.055;
                if (distLeft < pinchThreshold && distRight < pinchThreshold && !isCountingDown) {
                    triggerCapture();
                }

                const l_index = { x: leftHand[8].x * scaleX, y: leftHand[8].y * scaleY };
                const l_thumb = { x: leftHand[4].x * scaleX, y: leftHand[4].y * scaleY };
                const r_index = { x: rightHand[8].x * scaleX, y: rightHand[8].y * scaleY };
                const r_thumb = { x: rightHand[4].x * scaleX, y: rightHand[4].y * scaleY };

                canvasCtx.save();
                canvasCtx.beginPath();
                canvasCtx.moveTo(l_index.x, l_index.y);
                canvasCtx.lineTo(r_index.x, r_index.y);
                canvasCtx.lineTo(r_thumb.x, r_thumb.y);
                canvasCtx.lineTo(l_thumb.x, l_thumb.y);
                canvasCtx.closePath();

                canvasCtx.clip();

                if (currentMode === 'portal') {
                    canvasCtx.filter = 'saturate(180%) contrast(120%)';
                } else if (currentMode === 'inverted') {
                    canvasCtx.filter = 'invert(100%) saturate(200%)';
                } else if (currentMode === 'neon') {
                    canvasCtx.filter = 'hue-rotate(120deg) saturate(300%) contrast(150%)';
                } else {
                    canvasCtx.filter = 'none';
                }
                
                canvasCtx.drawImage(results.image, 0, 0, scaleX, scaleY);
                canvasCtx.restore();

                canvasCtx.strokeStyle = accentColor;
                canvasCtx.lineWidth = 4;
                canvasCtx.shadowBlur = 20;
                canvasCtx.shadowColor = accentColor;
                canvasCtx.beginPath();
                canvasCtx.moveTo(l_index.x, l_index.y);
                canvasCtx.lineTo(r_index.x, r_index.y);
                canvasCtx.lineTo(r_thumb.x, r_thumb.y);
                canvasCtx.lineTo(l_thumb.x, l_thumb.y);
                canvasCtx.closePath();
                canvasCtx.stroke();

                canvasCtx.strokeStyle = '#ffffff';
                canvasCtx.lineWidth = 2;
                canvasCtx.beginPath(); canvasCtx.moveTo(l_index.x, l_index.y); canvasCtx.lineTo(r_index.x, r_index.y); canvasCtx.stroke();
                canvasCtx.beginPath(); canvasCtx.moveTo(l_thumb.x, l_thumb.y); canvasCtx.lineTo(r_thumb.x, r_thumb.y); canvasCtx.stroke();
                canvasCtx.beginPath(); canvasCtx.moveTo(l_thumb.x, l_thumb.y); canvasCtx.lineTo(l_index.x, l_index.y); canvasCtx.stroke();
                canvasCtx.beginPath(); canvasCtx.moveTo(r_thumb.x, r_thumb.y); canvasCtx.lineTo(r_index.x, r_index.y); canvasCtx.stroke();

                [leftHand, rightHand].forEach(hand => {
                    drawConnectors(canvasCtx, hand, HAND_CONNECTIONS, {color: accentColor, lineWidth: 1});
                    drawLandmarks(canvasCtx, hand, {color: '#ffffff', lineWidth: 1, radius: 2});
                });

            } else {
                if (!isCountingDown) {
                    document.getElementById('status-text').innerHTML = `STATO: <span style="color: ${accentColor};">FAI IL PIZZICO CON LE 2 MANI</span>`;
                }
            }

            canvasCtx.restore();
        }

        const hands = new Hands({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
        });

        hands.setOptions({
            maxNumHands: 2,
            modelComplexity: 1,
            minDetectionConfidence: 0.7,
            minTrackingConfidence: 0.7
        });

        hands.onResults(onResults);

        function restartCamera() {
            if (cameraInstance) {
                cameraInstance.stop();
            }
            cameraInstance = new Camera(videoElement, {
                onFrame: async () => {
                    await hands.send({ image: videoElement });
                },
                width: 1920,
                height: 1080,
                facingMode: currentFacingMode
            });
            cameraInstance.start();
        }

        restartCamera();
    </script>
</body>
</html>

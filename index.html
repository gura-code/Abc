<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retrolens Mirrored Finger Mesh</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            color: #00ffcc;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        .hud-top {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(10, 10, 10, 0.85);
            border: 1px solid rgba(0, 255, 204, 0.4);
            padding: 12px 18px;
            border-radius: 6px;
            z-index: 20;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.2);
            /* Manteniamo l'HUD dritto e leggibile anche se il canvas è specchiato */
            transform: scaleX(1); 
        }

        h4 { margin: 0 0 8px 0; font-size: 13px; color: #ff007f; letter-spacing: 1px; }
        .filter-btn {
            background: rgba(0, 255, 204, 0.1);
            border: 1px solid #00ffcc;
            color: #00ffcc;
            padding: 5px 10px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 11px;
            cursor: pointer;
            border-radius: 3px;
            margin-right: 4px;
        }
        .filter-btn:hover, .filter-btn.active {
            background: #00ffcc;
            color: #000;
            font-weight: bold;
        }

        .input_video { display: none; }

        #output_canvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            /* RIBALTAMENTO TOTALE: Effetto specchio naturale per l'utente */
            transform: scaleX(-1);
            z-index: 2;
        }
    </style>
</head>
<body>

    <div class="hud-top">
        <h4>MIRRORED FINGER MESH FX</h4>
        <div id="status-text" style="font-size: 11px; margin-bottom: 8px; color: #fff;">MODALITÀ: <span style="color: #00ffcc;">FINESTRA A COLORI</span></div>
        <div>
            <button class="filter-btn active" onclick="setMode('portal')">Finestra Colore</button>
            <button class="filter-btn" onclick="setMode('inverted')">Portale Inverso</button>
            <button class="filter-btn" onclick="setMode('neon')">Neon Cyber</button>
        </div>
    </div>

    <video class="input_video" autoplay playsinline muted></video>
    <canvas id="output_canvas"></canvas>

    <script>
        const videoElement = document.querySelector('.input_video');
        const canvasElement = document.getElementById('output_canvas');
        const canvasCtx = canvasElement.getContext('2d');

        let currentMode = 'portal';

        function setMode(mode) {
            currentMode = mode;
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            let desc = mode === 'portal' ? 'Finestra Colore' : (mode === 'inverted' ? 'Portale Inverso' : 'Neon Cyber');
            document.getElementById('status-text').innerHTML = `MODALITÀ: <span style="color: #00ffcc;">${desc.toUpperCase()}</span>`;
        }

        function resizeCanvas() {
            canvasElement.width = window.innerWidth;
            canvasElement.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function onResults(results) {
            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

            if (!results.image) {
                canvasCtx.restore();
                return;
            }

            // 1. Sfondo in bianco e nero
            canvasCtx.filter = 'grayscale(100%) contrast(140%) brightness(80%)';
            canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);
            canvasCtx.filter = 'none';

            // 2. Controllo delle mani con orientamento naturale
            if (results.multiHandLandmarks && results.multiHandLandmarks.length >= 2 && results.multiHandedness) {
                let leftHand = null;
                let rightHand = null;

                for (let i = 0; i < results.multiHandLandmarks.length; i++) {
                    const landmarks = results.multiHandLandmarks[i];
                    const avgX = landmarks.reduce((acc, pt) => acc + pt.x, 0) / landmarks.length;

                    if (avgX < 0.5) {
                        leftHand = landmarks;
                    } else {
                        rightHand = landmarks;
                    }
                }

                if (!leftHand || !rightHand) {
                    leftHand = results.multiHandLandmarks[0];
                    rightHand = results.multiHandLandmarks[1];
                }

                const l_index = { x: leftHand[8].x * canvasElement.width, y: leftHand[8].y * canvasElement.height };
                const l_thumb = { x: leftHand[4].x * canvasElement.width, y: leftHand[4].y * canvasElement.height };
                const r_index = { x: rightHand[8].x * canvasElement.width, y: rightHand[8].y * canvasElement.height };
                const r_thumb = { x: rightHand[4].x * canvasElement.width, y: rightHand[4].y * canvasElement.height };

                canvasCtx.save();
                canvasCtx.beginPath();
                canvasCtx.moveTo(l_index.x, l_index.y);
                canvasCtx.lineTo(r_index.x, r_index.y);
                canvasCtx.lineTo(r_thumb.x, r_thumb.y);
                canvasCtx.lineTo(l_thumb.x, l_thumb.y);
                canvasCtx.closePath();

                canvasCtx.clip();

                if (currentMode === 'portal') {
                    canvasCtx.filter = 'saturate(180%) contrast(120%)';
                } else if (currentMode === 'inverted') {
                    canvasCtx.filter = 'invert(100%) saturate(200%)';
                } else if (currentMode === 'neon') {
                    canvasCtx.filter = 'hue-rotate(120deg) saturate(300%) contrast(150%)';
                }
                
                canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);
                canvasCtx.restore();

                // 3. Cornice wireframe ed evidenziazione dei collegamenti
                canvasCtx.strokeStyle = '#00ffcc';
                canvasCtx.lineWidth = 3;
                canvasCtx.shadowBlur = 18;
                canvasCtx.shadowColor = '#00ffcc';
                canvasCtx.beginPath();
                canvasCtx.moveTo(l_index.x, l_index.y);
                canvasCtx.lineTo(r_index.x, r_index.y);
                canvasCtx.lineTo(r_thumb.x, r_thumb.y);
                canvasCtx.lineTo(l_thumb.x, l_thumb.y);
                canvasCtx.closePath();
                canvasCtx.stroke();

                canvasCtx.strokeStyle = '#ff007f';
                canvasCtx.lineWidth = 2;
                // Indice <-> Indice
                canvasCtx.beginPath(); canvasCtx.moveTo(l_index.x, l_index.y); canvasCtx.lineTo(r_index.x, r_index.y); canvasCtx.stroke();
                // Pollice <-> Pollice
                canvasCtx.beginPath(); canvasCtx.moveTo(l_thumb.x, l_thumb.y); canvasCtx.lineTo(r_thumb.x, r_thumb.y); canvasCtx.stroke();
                // Pollice <-> Indice (mano sinistra)
                canvasCtx.beginPath(); canvasCtx.moveTo(l_thumb.x, l_thumb.y); canvasCtx.lineTo(l_index.x, l_index.y); canvasCtx.stroke();
                // Pollice <-> Indice (mano destra)
                canvasCtx.beginPath(); canvasCtx.moveTo(r_thumb.x, r_thumb.y); canvasCtx.lineTo(r_index.x, r_index.y); canvasCtx.stroke();

                // Scheletro delle mani
                [leftHand, rightHand].forEach(hand => {
                    drawConnectors(canvasCtx, hand, HAND_CONNECTIONS, {color: 'rgba(0, 255, 204, 0.3)', lineWidth: 1});
                    drawLandmarks(canvasCtx, hand, {color: '#ff007f', lineWidth: 1, radius: 2});
                });

            } else {
                canvasCtx.fillStyle = '#00ffcc';
                canvasCtx.font = '15px Courier New';
                canvasCtx.textAlign = 'center';
                canvasCtx.shadowBlur = 10;
                canvasCtx.shadowColor = '#00ffcc';
                canvasCtx.fillText("AVVICINA INDICI E POLLICI DI ENTRAMBE LE MANI", canvasElement.width / 2, canvasElement.height - 50);
            }

            canvasCtx.restore();
        }

        const hands = new Hands({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
        });

        hands.setOptions({
            maxNumHands: 2,
            modelComplexity: 1,
            minDetectionConfidence: 0.65,
            minTrackingConfidence: 0.65
        });

        hands.onResults(onResults);

        const camera = new Camera(videoElement, {
            onFrame: async () => {
                await hands.send({ image: videoElement });
            },
            width: 1280,
            height: 720,
            facingMode: 'user'
        });
        camera.start();
    </script>
</body>
</html>

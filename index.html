<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Retrolens Pro - Dual Effects Fixed</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 0;
            background-color: #030303;
            color: #00ffcc;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #app-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        video.input_video { display: none; }

        #output_canvas {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }

        #output_canvas.mirrored {
            transform: scaleX(-1);
        }

        #status-hud {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.75);
            border: 1px solid rgba(0, 255, 204, 0.4);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 11px;
            letter-spacing: 1px;
            z-index: 10;
            pointer-events: none;
            backdrop-filter: blur(5px);
            text-align: center;
            white-space: nowrap;
        }

        .top-hud {
            position: absolute;
            top: 15px;
            right: 15px;
            z-index: 20;
            display: flex;
            gap: 8px;
        }

        .hud-btn {
            background: rgba(10, 10, 10, 0.8);
            border: 1px solid #00ffcc;
            color: #00ffcc;
            padding: 8px 12px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 11px;
            cursor: pointer;
            border-radius: 6px;
            backdrop-filter: blur(5px);
            font-weight: bold;
        }
        .hud-btn:hover { background: #00ffcc; color: #000; }

        #download-btn {
            display: none;
            background: #ff007f;
            border-color: #ff007f;
            color: #fff;
        }
        #download-btn:hover { background: #ff3399; }

        #settings-panel {
            position: absolute;
            top: 0; right: -100%;
            width: 100%; max-width: 380px;
            height: 100%;
            background: rgba(10, 10, 10, 0.96);
            border-left: 1px solid rgba(0, 255, 204, 0.3);
            z-index: 100;
            padding: 25px;
            transition: right 0.3s ease-in-out;
            box-sizing: border-box;
            overflow-y: auto;
        }
        #settings-panel.open { right: 0; }

        .settings-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(0, 255, 204, 0.2);
            padding-bottom: 10px;
        }
        .settings-header h3 { margin: 0; color: #ff007f; font-size: 15px; letter-spacing: 2px; }

        .control-group { margin-bottom: 18px; }
        .control-group label {
            display: block;
            font-size: 10px;
            color: #aaa;
            margin-bottom: 6px;
            letter-spacing: 1px;
            font-weight: bold;
        }

        .option-btn {
            background: rgba(0, 255, 204, 0.08);
            border: 1px solid #00ffcc;
            color: #00ffcc;
            padding: 6px 10px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 10px;
            cursor: pointer;
            border-radius: 4px;
            margin-right: 4px;
            margin-bottom: 6px;
        }
        .option-btn.active, .option-btn:hover {
            background: #00ffcc;
            color: #000;
            font-weight: bold;
        }

        input[type="color"] {
            border: 1px solid #00ffcc;
            width: 40px; height: 26px;
            background: transparent;
            cursor: pointer;
            vertical-align: middle;
        }

        #error-overlay {
            position: absolute;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: #050505;
            z-index: 200;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            text-align: center;
        }
        #error-overlay h2 { color: #ff007f; margin-bottom: 10px; font-size: 18px; }
        #error-overlay p { font-size: 12px; color: #ccc; max-width: 320px; line-height: 1.5; margin-bottom: 20px; }
        
        #countdown-overlay {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 110px;
            font-weight: bold;
            color: #ff007f;
            text-shadow: 0 0 30px #ff007f;
            z-index: 50;
            display: none;
            pointer-events: none;
        }

        #flash-overlay {
            position: absolute;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: white;
            z-index: 60;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease-out;
        }
    </style>
</head>
<body>

    <div id="error-overlay">
        <h2>RETROLENS PRO</h2>
        <p id="error-msg">Inizializzazione fotocamera in corso...</p>
        <button class="hud-btn" id="retry-btn" onclick="initCamera()" style="display:none; padding: 10px 20px;">RIPROVA</button>
    </div>

    <div id="app-container">
        <div class="top-hud">
            <button class="hud-btn" id="download-btn" onclick="downloadImage()">💾 SALVA</button>
            <button class="hud-btn" onclick="toggleSettings()">⚙️ MENU</button>
        </div>

        <div id="countdown-overlay">3</div>
        <div id="flash-overlay"></div>

        <video class="input_video" autoplay playsinline muted></video>
        <canvas id="output_canvas"></canvas>

        <div id="status-hud">STATO: <span id="status-text">AVVIAMENTO...</span></div>

        <div id="settings-panel">
            <div class="settings-header">
                <h3>EFFETTI SEPARATI</h3>
                <button class="hud-btn" onclick="toggleSettings()">✕</button>
            </div>

            <div class="control-group">
                <label>FOTOCAMERA:</label>
                <button class="option-btn" onclick="setCamera('user', this)">Frontale</button>
                <button class="option-btn active" onclick="setCamera('environment', this)">Retro (Petto)</button>
            </div>

            <div class="control-group">
                <label>EFFETTO SPECCHIO:</label>
                <button class="option-btn" onclick="setMirror(true, this)">Attivo</button>
                <button class="option-btn active" onclick="setMirror(false, this)">Disattivato</button>
            </div>

            <div class="control-group">
                <label>COLORE BORDO PORTALE:</label>
                <input type="color" id="theme-color" value="#00ffcc" onchange="accentColor = this.value">
            </div>

            <div class="control-group">
                <label>✨ DENTRO IL PORTALE (MANI):</label>
                <button class="option-btn active" onclick="setInsideEffect('color', this)">Colore Vivo</button>
                <button class="option-btn" onclick="setInsideEffect('bw', this)">Bianco e Nero</button>
                <button class="option-btn" onclick="setInsideEffect('blur', this)">Sfocato (Blur)</button>
                <button class="option-btn" onclick="setInsideEffect('pixel', this)">Pixelato</button>
                <button class="option-btn" onclick="setInsideEffect('inverse', this)">Inverso</button>
            </div>

            <div class="control-group">
                <label>🌌 FUORI DAL PORTALE (SFONDO):</label>
                <button class="option-btn" onclick="setOutsideEffect('color', this)">Colore Vivo</button>
                <button class="option-btn active" onclick="setOutsideEffect('bw', this)">Bianco e Nero</button>
                <button class="option-btn" onclick="setOutsideEffect('blur', this)">Sfocato (Blur)</button>
                <button class="option-btn" onclick="setOutsideEffect('pixel', this)">Pixelato</button>
                <button class="option-btn" onclick="setOutsideEffect('inverse', this)">Inverso</button>
            </div>
        </div>
    </div>

    <script>
        const videoElement = document.querySelector('.input_video');
        const canvasElement = document.getElementById('output_canvas');
        const canvasCtx = canvasElement.getContext('2d', { alpha: false }); // Canvas opaco per evitare sfondi trasparenti
        const statusText = document.getElementById('status-text');
        const errorOverlay = document.getElementById('error-overlay');
        const errorMsg = document.getElementById('error-msg');
        const retryBtn = document.getElementById('retry-btn');
        const downloadBtn = document.getElementById('download-btn');
        const countdownEl = document.getElementById('countdown-overlay');
        const flashEl = document.getElementById('flash-overlay');
        const settingsPanel = document.getElementById('settings-panel');

        let insideEffect = 'color';
        let outsideEffect = 'bw';
        let currentFacingMode = 'environment';
        let isMirrored = false;
        let accentColor = '#00ffcc';
        let isCountingDown = false;
        let cameraInstance = null;
        let lastCapturedUrl = null;

        function toggleSettings() {
            settingsPanel.classList.toggle('open');
        }

        function setInsideEffect(eff, btn) {
            insideEffect = eff;
            const group = btn.parentElement;
            group.querySelectorAll('.option-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        function setOutsideEffect(eff, btn) {
            outsideEffect = eff;
            const group = btn.parentElement;
            group.querySelectorAll('.option-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        function setCamera(facing, btn) {
            currentFacingMode = facing;
            document.querySelectorAll('#settings-panel .control-group:nth-child(1) .option-btn').forEach(b => b.classList.remove('active'));
            if(btn) btn.classList.add('active');
            
            if (facing === 'user') {
                setMirror(true, document.querySelector('[onclick="setMirror(true, this)"]'));
            } else {
                setMirror(false, document.querySelector('[onclick="setMirror(false, this)"]'));
            }
            initCamera();
        }

        function setMirror(mirrorState, btn) {
            isMirrored = mirrorState;
            document.querySelectorAll('#settings-panel .control-group:nth-child(2) .option-btn').forEach(b => b.classList.remove('active'));
            if(btn) btn.classList.add('active');
            if (isMirrored) canvasElement.classList.add('mirrored');
            else canvasElement.classList.remove('mirrored');
        }

        function resizeCanvas() {
            canvasElement.width = window.innerWidth * window.devicePixelRatio;
            canvasElement.height = window.innerHeight * window.devicePixelRatio;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function renderFilteredImage(ctx, image, effectType, w, h) {
            if (effectType === 'color') {
                ctx.filter = 'saturate(180%) contrast(110%)';
                ctx.drawImage(image, 0, 0, w, h);
            } else if (effectType === 'bw') {
                ctx.filter = 'grayscale(100%) contrast(140%) brightness(90%)';
                ctx.drawImage(image, 0, 0, w, h);
            } else if (effectType === 'blur') {
                ctx.filter = 'blur(15px) saturate(130%)';
                ctx.drawImage(image, 0, 0, w, h);
            } else if (effectType === 'inverse') {
                ctx.filter = 'invert(100%) saturate(200%)';
                ctx.drawImage(image, 0, 0, w, h);
            } else if (effectType === 'pixel') {
                ctx.filter = 'none';
                const pScale = 0.04;
                const pw = Math.max(1, Math.floor(w * pScale));
                const ph = Math.max(1, Math.floor(h * pScale));
                
                const offScreen = document.createElement('canvas');
                offScreen.width = pw;
                offScreen.height = ph;
                const offCtx = offScreen.getContext('2d');
                offCtx.drawImage(image, 0, 0, pw, ph);
                
                ctx.imageSmoothingEnabled = false;
                ctx.drawImage(offScreen, 0, 0, pw, ph, 0, 0, w, h);
                ctx.imageSmoothingEnabled = true;
            } else {
                ctx.filter = 'none';
                ctx.drawImage(image, 0, 0, w, h);
            }
            ctx.filter = 'none';
        }

        function triggerCapture() {
            if (isCountingDown) return;
            isCountingDown = true;
            
            let count = 3;
            countdownEl.style.display = 'block';
            countdownEl.innerText = count;
            statusText.innerText = `ATTENDI (${count})...`;

            let timer = setInterval(() => {
                count--;
                if (count > 0) {
                    countdownEl.innerText = count;
                    statusText.innerText = `ATTENDI (${count})...`;
                } else {
                    clearInterval(timer);
                    countdownEl.style.display = 'none';
                    
                    flashEl.style.opacity = '1';
                    setTimeout(() => { flashEl.style.opacity = '0'; }, 300);

                    statusText.innerText = "FOTO SCATTATA!";
                    lastCapturedUrl = canvasElement.toDataURL('image/jpeg', 0.95);
                    
                    const link = document.createElement('a');
                    link.href = lastCapturedUrl;
                    link.download = `retrolens-dual-${Date.now()}.jpg`;
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);

                    downloadBtn.style.display = 'block';
                    setTimeout(() => { isCountingDown = false; }, 2000);
                }
            }, 1000);
        }

        function downloadImage() {
            if (!lastCapturedUrl) return;
            const link = document.createElement('a');
            link.href = lastCapturedUrl;
            link.download = `retrolens-dual-${Date.now()}.jpg`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function onResults(results) {
            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

            if (!results.image) {
                canvasCtx.restore();
                return;
            }

            const w = canvasElement.width;
            const h = canvasElement.height;

            // 1. Disegna SEMPRE l'esterno su tutto lo schermo come base solida
            renderFilteredImage(canvasCtx, results.image, outsideEffect, w, h);

            if (results.multiHandLandmarks && results.multiHandLandmarks.length >= 2) {
                let leftHand = null;
                let rightHand = null;

                for (let i = 0; i < results.multiHandLandmarks.length; i++) {
                    const lm = results.multiHandLandmarks[i];
                    const avgX = lm.reduce((acc, pt) => acc + pt.x, 0) / lm.length;
                    if (currentFacingMode === 'environment') {
                        if (avgX > 0.5) { leftHand = lm; } else { rightHand = lm; }
                    } else {
                        if (avgX < 0.5) { leftHand = lm; } else { rightHand = lm; }
                    }
                }

                if (!leftHand || !rightHand) {
                    leftHand = results.multiHandLandmarks[0];
                    rightHand = results.multiHandLandmarks[1];
                }

                const distLeft = Math.hypot(leftHand[4].x - leftHand[8].x, leftHand[4].y - leftHand[8].y);
                const distRight = Math.hypot(rightHand[4].x - rightHand[8].x, rightHand[4].y - rightHand[8].y);

                const pinchThreshold = 0.06;
                if (distLeft < pinchThreshold && distRight < pinchThreshold && !isCountingDown) {
                    triggerCapture();
                }

                if (!isCountingDown) {
                    statusText.innerText = "PRONTO - UNISCI I PUNTI CON LE 2 MANI";
                }

                const l_index = { x: leftHand[8].x * w, y: leftHand[8].y * h };
                const l_thumb = { x: leftHand[4].x * w, y: leftHand[4].y * h };
                const r_index = { x: rightHand[8].x * w, y: rightHand[8].y * h };
                const r_thumb = { x: rightHand[4].x * w, y: rightHand[4].y * h };

                // 2. Disegna l'INTERNO del portale sopra lo sfondo ritagliando l'area esatta delle mani
                canvasCtx.save();
                canvasCtx.beginPath();
                canvasCtx.moveTo(l_index.x, l_index.y);
                canvasCtx.lineTo(r_index.x, r_index.y);
                canvasCtx.lineTo(r_thumb.x, r_thumb.y);
                canvasCtx.lineTo(l_thumb.x, l_thumb.y);
                canvasCtx.closePath();
                canvasCtx.clip();

                renderFilteredImage(canvasCtx, results.image, insideEffect, w, h);
                canvasCtx.restore();

                // 3. Cornice e scheletro mani
                canvasCtx.strokeStyle = accentColor;
                canvasCtx.lineWidth = 4;
                canvasCtx.shadowBlur = 15;
                canvasCtx.shadowColor = accentColor;
                canvasCtx.beginPath();
                canvasCtx.moveTo(l_index.x, l_index.y);
                canvasCtx.lineTo(r_index.x, r_index.y);
                canvasCtx.lineTo(r_thumb.x, r_thumb.y);
                canvasCtx.lineTo(l_thumb.x, l_thumb.y);
                canvasCtx.closePath();
                canvasCtx.stroke();
                canvasCtx.shadowBlur = 0;

                canvasCtx.strokeStyle = '#ffffff';
                canvasCtx.lineWidth = 2;
                canvasCtx.beginPath(); canvasCtx.moveTo(l_index.x, l_index.y); canvasCtx.lineTo(r_index.x, r_index.y); canvasCtx.stroke();
                canvasCtx.beginPath(); canvasCtx.moveTo(l_thumb.x, l_thumb.y); canvasCtx.lineTo(r_thumb.x, r_thumb.y); canvasCtx.stroke();
                canvasCtx.beginPath(); canvasCtx.moveTo(l_thumb.x, l_thumb.y); canvasCtx.lineTo(l_index.x, l_index.y); canvasCtx.stroke();
                canvasCtx.beginPath(); canvasCtx.moveTo(r_thumb.x, r_thumb.y); canvasCtx.lineTo(r_index.x, r_index.y); canvasCtx.stroke();

                [leftHand, rightHand].forEach(hand => {
                    drawConnectors(canvasCtx, hand, HAND_CONNECTIONS, {color: accentColor, lineWidth: 1});
                    drawLandmarks(canvasCtx, hand, {color: '#ffffff', lineWidth: 1, radius: 2});
                });

            } else {
                if (!isCountingDown) {
                    statusText.innerText = "MOSTRA 🐺 ENTRAMBE LE MANI ALLA CAMERA";
                }
            }

            canvasCtx.restore();
        }

        const hands = new Hands({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
        });

        hands.setOptions({
            maxNumHands: 2,
            modelComplexity: 1,
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
        });

        hands.onResults(onResults);

        async function initCamera() {
            errorMsg.innerText = "Avvio fotocamera in corso...";
            retryBtn.style.display = 'none';
            
            if (cameraInstance) {
                try { cameraInstance.stop(); } catch(e) {}
            }

            try {
                cameraInstance = new Camera(videoElement, {
                    onFrame: async () => {
                        await hands.send({ image: videoElement });
                    },
                    width: { ideal: 1280 },
                    height: { ideal: 720 },
                    facingMode: currentFacingMode
                });
                
                await cameraInstance.start();
                errorOverlay.style.display = 'none';
            } catch (err) {
                console.error("Errore fotocamera:", err);
                errorMsg.innerText = "Impossibile accedere alla fotocamera. Controlla i permessi o se un'altra app la sta bloccando.\n\nDettaglio: " + err.message;
                retryBtn.style.display = 'inline-block';
                errorOverlay.style.display = 'flex';
            }
        }

        initCamera();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Air Canvas - Sicuro e Funzionante</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #111;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        .input_video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
            opacity: 0.3;
            z-index: 1;
        }

        #paint_canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transform: scaleX(-1);
            z-index: 2;
        }

        #output_canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transform: scaleX(-1);
            z-index: 3;
            pointer-events: none;
        }

        #instruction {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 14px;
            letter-spacing: 2px;
            color: #00ffcc;
            background: rgba(0, 0, 0, 0.85);
            padding: 10px 20px;
            border: 1px solid #00ffcc;
            border-radius: 4px;
            z-index: 10;
            pointer-events: none;
            text-align: center;
        }
    </style>
</head>
<body>

    <div id="instruction">INIZIALIZZAZIONE WEBCAM IN CORSO...</div>

    <video class="input_video" autoplay playsinline muted></video>
    <canvas id="paint_canvas"></canvas>
    <canvas id="output_canvas"></canvas>

    <script>
        const videoElement = document.querySelector('.input_video');
        const paintCanvas = document.getElementById('paint_canvas');
        const paintCtx = paintCanvas.getContext('2d');
        const outputCanvas = document.getElementById('output_canvas');
        const outputCtx = outputCanvas.getContext('2d');
        const instructionEl = document.getElementById('instruction');

        function resizeCanvases() {
            paintCanvas.width = window.innerWidth;
            paintCanvas.height = window.innerHeight;
            outputCanvas.width = window.innerWidth;
            outputCanvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvases);
        resizeCanvases();

        function getPalette() {
            const rightX = 80; 
            return [
                { name: "Rosso", color: "#ff3333", x: rightX, y: 60, size: 45 },
                { name: "Arancione", color: "#ff9900", x: rightX, y: 130, size: 45 },
                { name: "Giallo", color: "#ffff33", x: rightX, y: 200, size: 45 },
                { name: "Verde", color: "#33cc33", x: rightX, y: 270, size: 45 },
                { name: "Blu", color: "#3333ff", x: rightX, y: 340, size: 45 },
                { name: "Viola", color: "#9933ff", x: rightX, y: 410, size: 45 },
                { name: "Bianco", color: "#ffffff", x: rightX, y: 480, size: 45 },
                { name: "Gomma", color: "#000000", x: rightX, y: 550, size: 45, isEraser: true }
            ];
        }

        let currentColor = "#ff3333";
        let isEraserActive = false;
        let brushSize = 10;
        
        let smoothX = null;
        let smoothY = null;
        let lastX = null;
        let lastY = null;
        let isDrawing = false;
        let pinchFramesCount = 0;

        function onResults(results) {
            outputCtx.save();
            outputCtx.clearRect(0, 0, outputCanvas.width, outputCanvas.height);

            const palette = getPalette();

            // Disegna palette
            palette.forEach(item => {
                outputCtx.beginPath();
                outputCtx.arc(item.x, item.y, item.size / 2, 0, Math.PI * 2);
                outputCtx.fillStyle = item.color;
                outputCtx.fill();
                outputCtx.lineWidth = 3;
                outputCtx.strokeStyle = (currentColor === item.color || (item.isEraser && isEraserActive)) ? "#00ffcc" : "#ffffff";
                outputCtx.stroke();
                outputCtx.closePath();

                outputCtx.save();
                outputCtx.translate(item.x + 35, item.y + 4);
                outputCtx.scale(-1, 1);
                outputCtx.fillStyle = "#ffffff";
                outputCtx.font = "12px Courier New";
                outputCtx.fillText(item.name, 0, 0);
                outputCtx.restore();
            });

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const landmarks = results.multiHandLandmarks[0];

                drawConnectors(outputCtx, landmarks, HAND_CONNECTIONS, {color: 'rgba(0, 255, 204, 0.5)', lineWidth: 2});
                drawLandmarks(outputCtx, landmarks, {color: '#ffffff', lineWidth: 1, radius: 3});

                const rawX = landmarks[8].x * window.innerWidth;
                const rawY = landmarks[8].y * window.innerHeight;
                const thumbX = landmarks[4].x * window.innerWidth;
                const thumbY = landmarks[4].y * window.innerHeight;

                if (smoothX === null || smoothY === null) {
                    smoothX = rawX;
                    smoothY = rawY;
                } else {
                    smoothX += (rawX - smoothX) * 0.4;
                    smoothY += (rawY - smoothY) * 0.4;
                }

                const pinchDist = Math.hypot(smoothX - thumbX, smoothY - thumbY);
                let isPinchedNow = pinchDist < 50;
                if (isPinchedNow) {
                    pinchFramesCount = Math.min(pinchFramesCount + 1, 5);
                } else {
                    pinchFramesCount = Math.max(pinchFramesCount - 1, 0);
                }
                const isStablePinched = pinchFramesCount >= 2;

                outputCtx.beginPath();
                outputCtx.arc(smoothX, smoothY, 9, 0, Math.PI * 2);
                outputCtx.fillStyle = isStablePinched ? "#00ffcc" : currentColor;
                outputCtx.fill();
                outputCtx.lineWidth = 2;
                outputCtx.strokeStyle = "#ffffff";
                outputCtx.stroke();

                let selectingColor = false;
                palette.forEach(item => {
                    const distToPalette = Math.hypot(smoothX - item.x, smoothY - item.y);
                    if (distToPalette < item.size / 2) {
                        selectingColor = true;
                        if (isStablePinched) {
                            if (item.isEraser) {
                                isEraserActive = true;
                            } else {
                                isEraserActive = false;
                                currentColor = item.color;
                            }
                        }
                    }
                });

                if (isStablePinched && !selectingColor) {
                    if (!isDrawing) {
                        isDrawing = true;
                        lastX = smoothX;
                        lastY = smoothY;
                    } else {
                        paintCtx.beginPath();
                        paintCtx.moveTo(lastX, lastY);
                        paintCtx.lineTo(smoothX, smoothY);
                        
                        if (isEraserActive) {
                            paintCtx.strokeStyle = "#000000";
                            paintCtx.lineWidth = 50;
                            paintCtx.globalCompositeOperation = "destination-out";
                        } else {
                            paintCtx.strokeStyle = currentColor;
                            paintCtx.lineWidth = brushSize;
                            paintCtx.globalCompositeOperation = "source-over";
                        }
                        
                        paintCtx.lineCap = "round";
                        paintCtx.lineJoin = "round";
                        paintCtx.stroke();
                        paintCtx.closePath();

                        lastX = smoothX;
                        lastY = smoothY;
                    }
                } else {
                    isDrawing = false;
                    lastX = null;
                    lastY = null;
                }

            } else {
                isDrawing = false;
                smoothX = null;
                smoothY = null;
                pinchFramesCount = 0;
            }

            outputCtx.restore();
        }

        async function startApp() {
            try {
                const hands = new Hands({
                    locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
                });

                hands.setOptions({
                    maxNumHands: 1,
                    modelComplexity: 1,
                    minDetectionConfidence: 0.75,
                    minTrackingConfidence: 0.75
                });

                hands.onResults(onResults);

                const camera = new Camera(videoElement, {
                    onFrame: async () => {
                        await hands.send({ image: videoElement });
                    },
                    width: 1280,
                    height: 720,
                    facingMode: 'user'
                });
                
                await camera.start();
                instructionEl.innerText = "USA L'INDICE • PIZZICO PER DISEGNARE • COLORI A DESTRA";
            } catch (error) {
                console.error(error);
                instructionEl.innerText = "ERRORE: Controlla i permessi della webcam o usa un server locale.";
            }
        }

        startApp();
    </script>
</body>
</html>

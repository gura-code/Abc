<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive HUD & Hand Tracking</title>
    <!-- Importazione delle librerie MediaPipe per il tracciamento e il disegno -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0E0E0E;
            color: #00ffcc;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        /* HUD Panels */
        .hud-panel {
            position: absolute;
            border: 1px solid rgba(0, 255, 204, 0.3);
            background: rgba(14, 14, 14, 0.8);
            padding: 10px 15px;
            font-size: 12px;
            letter-spacing: 1px;
            z-index: 10;
            pointer-events: none;
        }

        #top-left { top: 20px; left: 20px; }
        #top-right { top: 20px; right: 20px; text-align: right; }
        
        /* Video della webcam visibile in background con effetto trasparenza/stile HUD */
        .input_video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1); /* Specchia per effetto specchio naturale */
            opacity: 0.35; /* Semi-trasparente per non coprire la grafica */
            z-index: 1;
        }

        /* Canvas principale sopra la webcam per disegnare le linee delle dita e il cursore */
        #output_canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transform: scaleX(-1); /* Specchiato per allinearsi alla webcam */
            z-index: 2;
        }

        /* Cursore guidato dall'indice */
        #custom-cursor {
            position: absolute;
            width: 24px;
            height: 24px;
            border: 2px solid #00ffcc;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 20;
            transition: background-color 0.1s, transform 0.1s;
            box-shadow: 0 0 10px #00ffcc;
        }

        #custom-cursor.pinched {
            background-color: #ff0055;
            border-color: #ff0055;
            transform: translate(-50%, -50%) scale(0.6);
            box-shadow: 0 0 15px #ff0055;
        }

        /* Box interattivo centrale */
        .interactive-box {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 220px;
            height: 110px;
            border: 1px dashed rgba(0, 255, 204, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-size: 14px;
            z-index: 5;
            background: rgba(0, 255, 204, 0.05);
            pointer-events: none;
        }
    </style>
</head>
<body>

    <!-- Pannelli di controllo visivi (HUD) -->
    <div id="top-left" class="hud-panel">
        SYSTEM: ONLINE<br>
        CAMERA: FRONT (USER)<br>
        STATUS: <span id="status-text" style="color: #ff0055;">WAITING FOR HAND...</span>
    </div>

    <div id="top-right" class="hud-panel">
        TRACKING: ACTIVE<br>
        COORD_X: <span id="coord-x">0</span> | COORD_Y: <span id="coord-y">0</span>
    </div>

    <!-- Box interattivo -->
    <div class="interactive-box" id="target-box">
        TARGET ZONE<br>[ PINCH HERE ]
    </div>

    <!-- Cursore interattivo -->
    <div id="custom-cursor"></div>

    <!-- Elementi multimediali -->
    <video class="input_video" autoplay playsinline muted></video>
    <canvas id="output_canvas"></canvas>

    <script>
        const videoElement = document.querySelector('.input_video');
        const canvasElement = document.getElementById('output_canvas');
        const canvasCtx = canvasElement.getContext('2d');
        const cursor = document.getElementById('custom-cursor');
        
        const statusText = document.getElementById('status-text');
        const coordXText = document.getElementById('coord-x');
        const coordYText = document.getElementById('coord-y');
        const targetBox = document.getElementById('target-box');

        function resizeCanvas() {
            canvasElement.width = window.innerWidth;
            canvasElement.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function onResults(results) {
            // Pulisci il canvas a ogni fotogramma
            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                statusText.innerText = "HAND DETECTED";
                statusText.style.color = "#00ffcc";

                const landmarks = results.multiHandLandmarks[0];

                // DISEGNA LE LINEE E I PUNTI SULLA MANO (Scheletro olografico)
                drawConnectors(canvasCtx, landmarks, HAND_CONNECTIONS, {color: 'rgba(0, 255, 204, 0.6)', lineWidth: 2});
                drawLandmarks(canvasCtx, landmarks, {color: '#ff0055', lineWidth: 1, radius: 3});

                // Coordinate indice (punto 8) e pollice (punto 4)
                const indexFinger = landmarks[8];
                const thumb = landmarks[4];

                const x = indexFinger.x * window.innerWidth;
                const y = indexFinger.y * window.innerHeight;

                coordXText.innerText = Math.round(x);
                coordYText.innerText = Math.round(y);

                // Muovi il cursore
                cursor.style.left = `${x}px`;
                cursor.style.top = `${y}px`;

                // Rilevamento Pinch (pizzico)
                const distance = Math.hypot(
                    indexFinger.x - thumb.x,
                    indexFinger.y - thumb.y
                );

                if (distance < 0.05) {
                    cursor.classList.add('pinched');
                    const boxRect = targetBox.getBoundingClientRect();
                    if (x >= boxRect.left && x <= boxRect.right && y >= boxRect.top && y <= boxRect.bottom) {
                        targetBox.style.backgroundColor = "rgba(255, 0, 85, 0.25)";
                        targetBox.style.borderColor = "#ff0055";
                        targetBox.style.color = "#ff0055";
                    }
                } else {
                    cursor.classList.remove('pinched');
                    targetBox.style.backgroundColor = "rgba(0, 255, 204, 0.05)";
                    targetBox.style.borderColor = "rgba(0, 255, 204, 0.5)";
                    targetBox.style.color = "#00ffcc";
                }

            } else {
                statusText.innerText = "WAITING FOR HAND...";
                statusText.style.color = "#ff0055";
                coordXText.innerText = "0";
                coordYText.innerText = "0";
            }
            canvasCtx.restore();
        }

        const hands = new Hands({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
        });

        hands.setOptions({
            maxNumHands: 1,
            modelComplexity: 1,
            minDetectionConfidence: 0.6,
            minTrackingConfidence: 0.6
        });

        hands.onResults(onResults);

        // Avvio della webcam frontale con visualizzazione a schermo
        const camera = new Camera(videoElement, {
            onFrame: async () => {
                await hands.send({ image: videoElement });
            },
            width: 1280,
            height: 720,
            facingMode: 'user'
        });
        camera.start();
    </script>
</body>
</html>

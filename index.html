<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Hand Tracking FX & Photo Booth</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            color: #00ffcc;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        .input_video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
            z-index: 1;
        }

        #output_canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transform: scaleX(-1);
            z-index: 2;
        }

        #ui-layer {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid #00ffcc;
            padding: 15px;
            border-radius: 8px;
            pointer-events: auto;
        }

        h3 { margin: 0 0 10px 0; font-size: 14px; color: #ff007f; letter-spacing: 1px; }
        button {
            background: #00ffcc;
            border: none;
            color: #000;
            padding: 8px 12px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            margin-right: 5px;
            margin-bottom: 5px;
        }
        button:hover { background: #ff007f; color: #fff; }

        #flash {
            position: absolute;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: white;
            opacity: 0;
            z-index: 100;
            pointer-events: none;
            transition: opacity 0.2s ease-out;
        }
    </style>
</head>
<body>

    <div id="flash"></div>

    <div id="ui-layer">
        <h3>FILTRI TIKTOK FX</h3>
        <div id="filter-name" style="margin-bottom: 10px; font-size: 12px;">Filtro Attivo: <span style="color: #fff;">Cyber Neon</span></div>
        <button onclick="changeFilter(0)">Cyber Neon</button>
        <button onclick="changeFilter(1)">Matrix Green</button>
        <button onclick="changeFilter(2)">Retro Vaporwave</button>
        <br>
        <button onclick="takeSnapshot()" style="background: #ff007f; color: #fff; width: 100%; margin-top: 5px;">📸 FOTOGRAFA</button>
    </div>

    <video class="input_video" autoplay playsinline muted></video>
    <canvas id="output_canvas"></canvas>

    <script>
        const videoElement = document.querySelector('.input_video');
        const canvasElement = document.getElementById('output_canvas');
        const canvasCtx = canvasElement.getContext('2d');
        const flashElement = document.getElementById('flash');
        const filterNameDisplay = document.getElementById('filter-name');

        let currentFilter = 0;
        const filters = ['Cyber Neon', 'Matrix Green', 'Retro Vaporwave'];

        function changeFilter(index) {
            currentFilter = index;
            filterNameDisplay.innerHTML = `Filtro Attivo: <span style="color: #fff;">${filters[currentFilter]}</span>`;
        }

        function resizeCanvas() {
            canvasElement.width = window.innerWidth;
            canvasElement.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function takeSnapshot() {
            flashElement.style.opacity = '1';
            setTimeout(() => { flashElement.style.opacity = '0'; }, 200);

            // Crea un’immagine temporanea dello schermo corrente e la scarica
            const link = document.createElement('a');
            link.download = 'tiktok-effect-snapshot.png';
            link.href = canvasElement.toDataURL('image/png');
            link.click();
        }

        function onResults(results) {
            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

            // Disegna il video con il filtro colore scelto
            canvasCtx.filter = getCSSFilter();
            canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);
            canvasCtx.filter = 'none'; // reset filtri per gli elementi grafici

            // Se ci sono mani rilevate, disegna il rettangolo TikTok tra le mani
            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                
                // Se ci sono due mani, creiamo un riquadro che le collega o racchiude
                if (results.multiHandLandmarks.length >= 2) {
                    const h1 = results.multiHandLandmarks[0][0]; // polso mano 1
                    const h2 = results.multiHandLandmarks[1][0]; // polso mano 2

                    const x1 = (1 - h1.x) * canvasElement.width;
                    const y1 = h1.y * canvasElement.height;
                    const x2 = (1 - h2.x) * canvasElement.width;
                    const y2 = h2.y * canvasElement.height;

                    const minX = Math.min(x1, x2) - 80;
                    const minY = Math.min(y1, y2) - 100;
                    const boxWidth = Math.abs(x1 - x2) + 160;
                    const boxHeight = Math.abs(y1 - y2) + 200;

                    // Disegna il rettangolo in stile TikTok trend
                    canvasCtx.strokeStyle = currentFilter === 0 ? '#00ffcc' : (currentFilter === 1 ? '#00ff00' : '#ff00ff');
                    canvasCtx.lineWidth = 4;
                    canvasCtx.shadowBlur = 15;
                    canvasCtx.shadowColor = canvasCtx.strokeStyle;
                    canvasCtx.strokeRect(minX, minY, boxWidth, boxHeight);

                    // Angoli tecnologici del riquadro
                    drawTechCorners(canvasCtx, minX, minY, boxWidth, boxHeight);
                }

                // Disegna i punti sulle mani
                results.multiHandLandmarks.forEach((landmarks) => {
                    drawConnectors(canvasCtx, landmarks, HAND_CONNECTIONS, {color: 'rgba(255,255,255,0.3)', lineWidth: 1});
                    drawLandmarks(canvasCtx, landmarks, {color: '#ff007f', lineWidth: 1, radius: 3});
                });
            }

            canvasCtx.restore();
        }

        function getCSSFilter() {
            if (currentFilter === 0) return 'hue-rotate(90deg) saturate(180%) contrast(120%)';
            if (currentFilter === 1) return 'hue-rotate(120deg) brightness(90%) contrast(150%)';
            if (currentFilter === 2) return 'hue-rotate(290deg) saturate(200%) brightness(110%)';
            return 'none';
        }

        function drawTechCorners(ctx, x, y, w, h) {
            const len = 20;
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 3;
            // Top-left
            ctx.beginPath(); ctx.moveTo(x, y + len); ctx.lineTo(x, y); ctx.lineTo(x + len, y); ctx.stroke();
            // Top-right
            ctx.beginPath(); ctx.moveTo(x + w - len, y); ctx.lineTo(x + w, y); ctx.lineTo(x + w, y + len); ctx.stroke();
            // Bottom-left
            ctx.beginPath(); ctx.moveTo(x, y + h - len); ctx.lineTo(x, y + h); ctx.lineTo(x + len, y + h); ctx.stroke();
            // Bottom-right
            ctx.beginPath(); ctx.moveTo(x + w - len, y + h); ctx.lineTo(x + w, y + h); ctx.lineTo(x + w, y + h - len); ctx.stroke();
        }

        const hands = new Hands({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
        });

        hands.setOptions({
            maxNumHands: 2,
            modelComplexity: 1,
            minDetectionConfidence: 0.6,
            minTrackingConfidence: 0.6
        });

        hands.onResults(onResults);

        const camera = new Camera(videoElement, {
            onFrame: async () => {
                await hands.send({ image: videoElement });
            },
            width: 1280,
            height: 720,
            facingMode: 'user'
        });
        camera.start();
    </script>
</body>
</html>

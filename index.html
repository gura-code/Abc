<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COSMIC-S // Full Body Tracking</title>
    
    <!-- Google Fonts & MediaPipe Pose -->
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>

    <style>
        :root {
            --bg-color: #0E0E0E;
            --accent-color: #00FF66;
            --text-color: #F0F0F0;
            --panel-bg: rgba(20, 20, 20, 0.85);
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Space Grotesk', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .container {
            position: relative;
            width: 100%;
            max-width: 800px;
            height: 600px;
            border: 2px solid #222;
            border-radius: 12px;
            overflow: hidden;
            background: #000;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        video {
            display: none;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transform: scaleX(-1); /* Effetto specchio */
        }

        .hud {
            position: absolute;
            top: 20px;
            left: 20px;
            background: var(--panel-bg);
            padding: 12px 20px;
            border-radius: 8px;
            border: 1px solid #333;
            backdrop-filter: blur(5px);
            z-index: 10;
        }

        .hud h1 {
            margin: 0 0 5px 0;
            font-size: 16px;
            letter-spacing: 1px;
            color: var(--accent-color);
        }

        .hud p {
            margin: 0;
            font-size: 14px;
            color: #AAA;
        }

        .score-board {
            position: absolute;
            top: 20px;
            right: 20px;
            background: var(--panel-bg);
            padding: 12px 20px;
            border-radius: 8px;
            border: 1px solid #333;
            font-size: 18px;
            font-weight: 600;
            z-index: 10;
            color: var(--accent-color);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="hud">
            <h1>COSMIC-S // BODY SYSTEM</h1>
            <p>Stato: <span id="status">Calibrazione in corso...</span></p>
        </div>
        
        <div class="score-board">
            TARGET: <span id="score">0</span>
        </div>

        <video id="webcam" autoplay playsinline></video>
        <output id="output_canvas"></output>
        <canvas id="canvas"></canvas>
    </div>

    <script>
        const videoElement = document.getElementById('webcam');
        const canvasElement = document.getElementById('canvas');
        const canvasCtx = canvasElement.getContext('2d');
        const statusEl = document.getElementById('status');
        const scoreEl = document.getElementById('score');

        let score = 0;
        let targetPos = { x: Math.random() * 600 + 100, y: Math.random() * 400 + 100, radius: 25 };

        function resizeCanvas() {
            canvasElement.width = canvasElement.parentElement.clientWidth;
            canvasElement.height = canvasElement.parentElement.clientHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function onResults(results) {
            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

            // Disegna il flusso della webcam a schermo intero sul canvas
            canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

            if (results.poseLandmarks) {
                statusEl.innerText = "Sistema attivo & Online";
                statusEl.style.color = "#00FF66";

                // Disegna lo scheletro personalizzato in stile minimal/cyber
                drawCustomSkeleton(results.poseLandmarks);

                // Controlla se la mano destra (landmark 16) tocca il bersaglio virtuale
                checkTargetInteraction(results.poseLandmarks[16]);
            } else {
                statusEl.innerText = "Inquadratura persa...";
                statusEl.style.color = "#FF3333";
            }

            // Disegna il bersaglio da "prendere" muovendo il corpo
            drawTarget();

            canvasCtx.restore();
        }

        function drawCustomSkeleton(landmarks) {
            const w = canvasElement.width;
            const h = canvasElement.height;

            // Connessioni principali dello scheletro
            const connections = [
                [11, 12], [11, 13], [13, 15], [12, 14], [14, 16], // Braccia
                [11, 23], [12, 24], [23, 24],                    // Busto
                [23, 25], [25, 27], [24, 26], [26, 28]           // Gambe
            ];

            canvasCtx.strokeStyle = '#00FF66';
            canvasCtx.lineWidth = 3;

            connections.forEach(([i, j]) => {
                const p1 = landmarks[i];
                const p2 = landmarks[j];
                if (p1.visibility > 0.6 && p2.visibility > 0.6) {
                    canvasCtx.beginPath();
                    canvasCtx.moveTo(p1.x * w, p1.y * h);
                    canvasCtx.lineTo(p2.x * w, p2.y * h);
                    canvasCtx.stroke();
                }
            });

            // Punti nodali sulle giunture
            landmarks.forEach((p) => {
                if (p.visibility > 0.6) {
                    canvasCtx.fillStyle = '#FFFFFF';
                    canvasCtx.beginPath();
                    canvasCtx.arc(p.x * w, p.y * h, 4, 0, 2 * Math.PI);
                    canvasCtx.fill();
                }
            });
        }

        function drawTarget() {
            canvasCtx.strokeStyle = '#FF3366';
            canvasCtx.lineWidth = 4;
            canvasCtx.beginPath();
            canvasCtx.arc(targetPos.x, targetPos.y, targetPos.radius, 0, 2 * Math.PI);
            canvasCtx.stroke();

            canvasCtx.fillStyle = 'rgba(255, 51, 102, 0.3)';
            canvasCtx.fill();
        }

        function checkTargetInteraction(handLandmark) {
            if (!handLandmark || handLandmark.visibility < 0.6) return;

            const w = canvasElement.width;
            const h = canvasElement.height;
            const handX = handLandmark.x * w;
            const handY = handLandmark.y * h;

            // Distanza tra la mano e il centro del bersaglio
            const dist = Math.hypot(handX - targetPos.x, handY - targetPos.y);

            if (dist < targetPos.radius + 15) {
                // Bersaglio preso! Genera una nuova posizione casuale
                score++;
                scoreEl.innerText = score;
                targetPos.x = Math.random() * (canvasElement.width - 150) + 75;
                targetPos.y = Math.random() * (canvasElement.height - 150) + 75;
            }
        }

        const pose = new Pose({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
        });

        pose.setOptions({
            modelComplexity: 1,
            smoothLandmarks: true,
            enableSegmentation: false,
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
        });

        pose.onResults(onResults);

        const camera = new Camera(videoElement, {
            onFrame: async () => {
                await pose.send({ image: videoElement });
            },
            width: 1280,
            height: 720
        });
        camera.start();
    </script>
</body>
</html>

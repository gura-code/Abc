<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Air Canvas - Disegna con le Dita</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #111;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        .input_video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
            opacity: 0.15;
            z-index: 1;
        }

        /* Canvas per i disegni salvati */
        #paint_canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transform: scaleX(-1);
            z-index: 2;
        }

        /* Canvas per la webcam / UI interattiva */
        #output_canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transform: scaleX(-1);
            z-index: 3;
            pointer-events: none;
        }

        #instruction {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 14px;
            letter-spacing: 2px;
            color: #00ffcc;
            background: rgba(0, 0, 0, 0.7);
            padding: 8px 16px;
            border: 1px solid #00ffcc;
            border-radius: 4px;
            z-index: 10;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="instruction">USA L'INDICE PER MUOVERTI • PIZZICO PER DISEGNARE • TOCCA I COLORI A SINISTRA</div>

    <video class="input_video" autoplay playsinline muted></video>
    <!-- Canvas sottostante dove rimane impresso il disegno -->
    <canvas id="paint_canvas"></canvas>
    <!-- Canvas superiore per la mano e la palette colori -->
    <canvas id="output_canvas"></canvas>

    <script>
        const videoElement = document.querySelector('.input_video');
        const paintCanvas = document.getElementById('paint_canvas');
        const paintCtx = paintCanvas.getContext('2d');
        const outputCanvas = document.getElementById('output_canvas');
        const outputCtx = outputCanvas.getContext('2d');

        function resizeCanvases() {
            paintCanvas.width = window.innerWidth;
            paintCanvas.height = window.innerHeight;
            outputCanvas.width = window.innerWidth;
            outputCanvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvases);
        resizeCanvases();

        // Lista dei colori e della gomma (ordinate in verticale a sinistra)
        const palette = [
            { name: "Rosso", color: "#ff3333", x: 30, y: 50, size: 40 },
            { name: "Arancione", color: "#ff9900", x: 30, y: 110, size: 40 },
            { name: "Giallo", color: "#ffff33", x: 30, y: 170, size: 40 },
            { name: "Verde", color: "#33cc33", x: 30, y: 230, size: 40 },
            { name: "Blu", color: "#3333ff", x: 30, y: 290, size: 40 },
            { name: "Viola", color: "#9933ff", x: 30, y: 350, size: 40 },
            { name: "Bianco", color: "#ffffff", x: 30, y: 410, size: 40 },
            { name: "Gomma", color: "#000000", x: 30, y: 470, size: 40, isEraser: true }
        ];

        let currentColor = "#ff3333";
        let isEraserActive = false;
        let brushSize = 8;
        let lastX = null;
        let lastY = null;
        let isDrawing = false;

        function onResults(results) {
            outputCtx.save();
            outputCtx.clearRect(0, 0, outputCanvas.width, outputCanvas.height);

            // Disegna la palette dei colori sulla sinistra
            palette.forEach(item => {
                outputCtx.beginPath();
                outputCtx.arc(item.x, item.y, item.size / 2, 0, Math.PI * 2);
                outputCtx.fillStyle = item.color;
                outputCtx.fill();
                outputCtx.lineWidth = 3;
                outputCtx.strokeStyle = (currentColor === item.color || (item.isEraser && isEraserActive)) ? "#00ffcc" : "#ffffff";
                outputCtx.stroke();
                outputCtx.closePath();

                // Etichetta testuale del colore
                outputCtx.fillStyle = "#ffffff";
                outputCtx.font = "11px Courier New";
                outputCtx.fillText(item.name, item.x + 30, item.y + 4);
            });

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const landmarks = results.multiHandLandmarks[0];

                // Coordinate dell'indice (punto 8) e del pollice (punto 4)
                // Nota: poiché il canvas è specchiato via CSS, gestiamo le coordinate di conseguenza
                const indexX = (1 - landmarks[8].x) * window.innerWidth;
                const indexY = landmarks[8].y * window.innerHeight;
                const thumbX = (1 - landmarks[4].x) * window.innerWidth;
                const thumbY = landmarks[4].y * window.innerHeight;

                // Calcola la distanza tra pollice e indice per il "pizzico"
                const pinchDist = Math.hypot(indexX - thumbX, indexY - thumbY);
                const isPinched = pinchDist < 40; // Soglia per considerare il pizzico attivo

                // Disegna il cursore sulla punta dell'indice
                outputCtx.beginPath();
                outputCtx.arc(indexX, indexY, 8, 0, Math.PI * 2);
                outputCtx.fillStyle = isPinched ? "#00ffcc" : currentColor;
                outputCtx.fill();
                outputCtx.lineWidth = 2;
                outputCtx.strokeStyle = "#ffffff";
                outputCtx.stroke();

                // Controllo se l'utente sta selezionando un colore dalla palette
                let selectingColor = false;
                palette.forEach(item => {
                    const distToPalette = Math.hypot(indexX - item.x, indexY - item.y);
                    if (distToPalette < item.size / 2) {
                        selectingColor = true;
                        // Se fa il pizzico sul colore, lo seleziona
                        if (isPinched) {
                            if (item.isEraser) {
                                isEraserActive = true;
                            } else {
                                isEraserActive = false;
                                currentColor = item.color;
                            }
                        }
                    }
                });

                // Se non sta selezionando i colori ed è in modalità pizzico, disegna!
                if (isPinched && !selectingColor) {
                    if (!isDrawing) {
                        // Inizia un nuovo tratto
                        isDrawing = true;
                        lastX = indexX;
                        lastY = indexY;
                    } else {
                        // Disegna la linea sul canvas persistente
                        paintCtx.beginPath();
                        paintCtx.moveTo(lastX, lastY);
                        paintCtx.lineTo(indexX, indexY);
                        
                        if (isEraserActive) {
                            paintCtx.strokeStyle = "#000000";
                            paintCtx.lineWidth = 35; // Gomma più larga
                            paintCtx.globalCompositeOperation = "destination-out"; // Cancella realmente
                        } else {
                            paintCtx.strokeStyle = currentColor;
                            paintCtx.lineWidth = brushSize;
                            paintCtx.globalCompositeOperation = "source-over";
                        }
                        
                        paintCtx.lineCap = "round";
                        paintCtx.lineJoin = "round";
                        paintCtx.stroke();
                        paintCtx.closePath();

                        lastX = indexX;
                        lastY = indexY;
                    }
                } else {
                    isDrawing = false;
                    lastX = null;
                    lastY = null;
                }

            } else {
                isDrawing = false;
            }

            outputCtx.restore();
        }

        const hands = new Hands({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
        });

        hands.setOptions({
            maxNumHands: 1,
            modelComplexity: 1,
            minDetectionConfidence: 0.7,
            minTrackingConfidence: 0.7
        });

        hands.onResults(onResults);

        const camera = new Camera(videoElement, {
            onFrame: async () => {
                await hands.send({ image: videoElement });
            },
            width: 1280,
            height: 720,
            facingMode: 'user'
        });
        camera.start();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gojo Precise Hand Signs - JJK</title>
    <!-- Importazione librerie MediaPipe -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #030308;
            color: #00d2ff;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        .hud-panel {
            position: absolute;
            border: 1px solid rgba(0, 210, 255, 0.4);
            background: rgba(3, 3, 8, 0.85);
            padding: 10px 15px;
            font-size: 12px;
            letter-spacing: 1px;
            z-index: 10;
            pointer-events: none;
            box-shadow: 0 0 10px rgba(0, 210, 255, 0.2);
        }

        #top-left { top: 20px; left: 20px; }
        #top-right { top: 20px; right: 20px; text-align: right; }
        
        .input_video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
            opacity: 0.25;
            z-index: 1;
        }

        #output_canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transform: scaleX(-1);
            z-index: 2;
        }

        /* Sfera di Energia */
        #energy-orb {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 90px;
            height: 90px;
            border-radius: 50%;
            transform: translate(-50%, -50%) scale(0);
            pointer-events: none;
            z-index: 15;
            transition: all 0.15s ease-out;
            box-shadow: 0 0 40px #00d2ff, inset 0 0 20px #ffffff;
            background: radial-gradient(circle, #ffffff 0%, #00d2ff 60%, #0044ff 100%);
        }

        #technique-display {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 18px;
            letter-spacing: 3px;
            color: #00d2ff;
            text-shadow: 0 0 10px #00d2ff;
            z-index: 20;
            text-align: center;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="top-left" class="hud-panel">
        TECHNIQUE: <span id="tech-name" style="color: #00d2ff;">MUKAGEN (IDLE)</span><br>
        STATUS: <span id="status-text" style="color: #ff3366;">IN ATTESA DI GESTO...</span>
    </div>

    <div id="top-right" class="hud-panel">
        MODE: PRECISE MUDRA<br>
        ENERGY: <span id="energy-level" style="color: #00d2ff;">STABLE</span>
    </div>

    <div id="energy-orb"></div>
    <div id="technique-display">FA UN GESTO PRECISO DI GOJO</div>

    <video class="input_video" autoplay playsinline muted></video>
    <canvas id="output_canvas"></canvas>

    <script>
        const videoElement = document.querySelector('.input_video');
        const canvasElement = document.getElementById('output_canvas');
        const canvasCtx = canvasElement.getContext('2d');
        
        const statusText = document.getElementById('status-text');
        const techName = document.getElementById('tech-name');
        const energyLevel = document.getElementById('energy-level');
        const energyOrb = document.getElementById('energy-orb');
        const techniqueDisplay = document.getElementById('technique-display');

        function resizeCanvas() {
            canvasElement.width = window.innerWidth;
            canvasElement.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Funzione di supporto per controllare se un dito è teso (confrontando la punta con le nocche)
        function isFingerExtended(tip, pip) {
            return tip.y < pip.y; // Nello spazio video Y cresce verso il basso
        }

        function onResults(results) {
            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                statusText.innerText = "MANA RILEVATA";
                statusText.style.color = "#00d2ff";

                const landmarks = results.multiHandLandmarks[0];

                // Disegno scheletro pulito color azzurro/blu
                drawConnectors(canvasCtx, landmarks, HAND_CONNECTIONS, {color: 'rgba(0, 210, 255, 0.5)', lineWidth: 2});
                drawLandmarks(canvasCtx, landmarks, {color: '#ffffff', lineWidth: 1, radius: 3});

                // Posizione dell'indice (punto 8) come riferimento per la sfera
                const x = (1 - landmarks[8].x) * window.innerWidth;
                const y = landmarks[8].y * window.innerHeight;
                energyOrb.style.left = `${x}px`;
                energyOrb.style.top = `${y}px`;

                // Analisi precisa dello stato delle dita per capire il MUDRA esatto
                // Indice (punto 8 teso se y < punto 6)
                const indexExtended = isFingerExtended(landmarks[8], landmarks[6]);
                // Medio (punto 12 teso se y < punto 10)
                const middleExtended = isFingerExtended(landmarks[12], landmarks[10]);
                // Anulare (punto 16 teso se y < punto 14)
                const ringExtended = isFingerExtended(landmarks[16], landmarks[14]);
                // Mignolo (punto 20 teso se y < punto 18)
                const pinkyExtended = isFingerExtended(landmarks[20], landmarks[18]);

                // Distanza tra pollice (4) e indice (8) per il controllo del cerchio/pizzico
                const thumbIndexDist = Math.hypot(landmarks[4].x - landmarks[8].x, landmarks[4].y - landmarks[8].y);

                // --- LOGICA DEI GESTI SPECIFICI ---

                if (indexExtended && !middleExtended && !ringExtended && !pinkyExtended) {
                    // --- GESTO 1: SOLO INDICE TESO (TECNICA ROSSA / AKA) ---
                    // Corrisponde alla posa dove Gojo alza l'indice puntato
                    energyOrb.style.transform = "translate(-50%, -50%) scale(1.6)";
                    energyOrb.style.boxShadow = "0 0 50px #ff0033, inset 0 0 25px #ffffff";
                    energyOrb.style.background = "radial-gradient(circle, #ffffff 0%, #ff0033 60%, #880011 100%)";
                    
                    techName.innerText = "REVERSE CT: RED (AKA)";
                    techName.style.color = "#ff0033";
                    energyLevel.innerText = "REPEL";
                    techniqueDisplay.innerText = "🔴 TECNICA MALEDETTA: ROSSA";
                    techniqueDisplay.style.color = "#ff0033";
                    techniqueDisplay.style.textShadow = "0 0 15px #ff0033";

                } else if (indexExtended && middleExtended && !ringExtended && !pinkyExtended) {
                    // --- GESTO 2: DUE DITA TESE O INCROCIATE (TECNICA BLU / AO) ---
                    // Corrisponde al segno delle due dita alzate o intrecciate
                    energyOrb.style.transform = "translate(-50%, -50%) scale(1.2)";
                    energyOrb.style.boxShadow = "0 0 40px #00d2ff, inset 0 0 20px #ffffff";
                    energyOrb.style.background = "radial-gradient(circle, #ffffff 0%, #00d2ff 60%, #0044ff 100%)";
                    
                    techName.innerText = "CURSED TECHNIQUE: BLUE (AO)";
                    techName.style.color = "#00d2ff";
                    energyLevel.innerText = "ATTRACT";
                    techniqueDisplay.innerText = "🔵 TECNICA MALEDETTA: BLU";
                    techniqueDisplay.style.color = "#00d2ff";
                    techniqueDisplay.style.textShadow = "0 0 10px #00d2ff";

                } else if (thumbIndexDist < 0.04 && ringExtended && pinkyExtended) {
                    // --- GESTO 3: CERCHIO CON POLLICE E INDICE (TECNICA IMMAGINARIA / VIOLA - MURASAKI) ---
                    // Corrisponde esattamente alla posa iconica con le dita a cerchio (come nelle foto)
                    energyOrb.style.transform = "translate(-50%, -50%) scale(2.5)";
                    energyOrb.style.boxShadow = "0 0 70px #b000ff, inset 0 0 35px #ffffff";
                    energyOrb.style.background = "radial-gradient(circle, #ffffff 0%, #b000ff 50%, #440088 100%)";
                    
                    techName.innerText = "IMAGINARY: PURPLE (MURASAKI)";
                    techName.style.color = "#b000ff";
                    energyLevel.innerText = "MAXIMUM OUTPUT";
                    techniqueDisplay.innerText = "🟣 TECNICA IMMAGINARIA: VIOLA";
                    techniqueDisplay.style.color = "#b000ff";
                    techniqueDisplay.style.textShadow = "0 0 20px #b000ff";

                } else {
                    // --- NESSUN GESTO VALIDO (STANBY) ---
                    energyOrb.style.transform = "translate(-50%, -50%) scale(0)";
                    techName.innerText = "MUKAGEN (NEUTRAL)";
                    techName.style.color = "#00d2ff";
                    energyLevel.innerText = "STABLE";
                    techniqueDisplay.innerText = "FAI IL MUDRA CORRETTO (BLU, ROSSO O VIOLA)";
                    techniqueDisplay.style.color = "#00d2ff";
                    techniqueDisplay.style.textShadow = "0 0 10px #00d2ff";
                }

            } else {
                statusText.innerText = "IN ATTESA DI GESTO...";
                statusText.style.color = "#ff3366";
                energyOrb.style.transform = "translate(-50%, -50%) scale(0)";
                techniqueDisplay.innerText = "MOSTRA LA MANO ALLA WEBCAM";
            }
            canvasCtx.restore();
        }

        const hands = new Hands({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
        });

        hands.setOptions({
            maxNumHands: 1,
            modelComplexity: 1,
            minDetectionConfidence: 0.7,
            minTrackingConfidence: 0.7
        });

        hands.onResults(onResults);

        const camera = new Camera(videoElement, {
            onFrame: async () => {
                await hands.send({ image: videoElement });
            },
            width: 1280,
            height: 720,
            facingMode: 'user'
        });
        camera.start();
    </script>
</body>
</html>

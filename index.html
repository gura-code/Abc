<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retrolens Pinch-to-Snap FX</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            color: #00ffcc;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        .hud-top {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(10, 10, 10, 0.85);
            border: 1px solid rgba(0, 255, 204, 0.4);
            padding: 12px 18px;
            border-radius: 6px;
            z-index: 20;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.2);
            transform: scaleX(1); 
        }

        h4 { margin: 0 0 8px 0; font-size: 13px; color: #ff007f; letter-spacing: 1px; }
        .filter-btn {
            background: rgba(0, 255, 204, 0.1);
            border: 1px solid #00ffcc;
            color: #00ffcc;
            padding: 5px 10px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 11px;
            cursor: pointer;
            border-radius: 3px;
            margin-right: 4px;
        }
        .filter-btn:hover, .filter-btn.active {
            background: #00ffcc;
            color: #000;
            font-weight: bold;
        }

        /* Overlay countdown & flash */
        #countdown-overlay {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 120px;
            font-weight: bold;
            color: #ff007f;
            text-shadow: 0 0 30px #ff007f;
            z-index: 30;
            display: none;
            pointer-events: none;
        }

        #flash-overlay {
            position: absolute;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: white;
            z-index: 40;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease-out;
        }

        .input_video { display: none; }

        #output_canvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            transform: scaleX(-1);
            z-index: 2;
        }
    </style>
</head>
<body>

    <div class="hud-top">
        <h4>PINCH TO SNAP FX</h4>
        <div id="status-text" style="font-size: 11px; margin-bottom: 8px; color: #fff;">STATO: <span style="color: #00ffcc;">PRONTO (FAI IL PIZZICO)</span></div>
        <div>
            <button class="filter-btn active" onclick="setMode('portal')">Finestra Colore</button>
            <button class="filter-btn" onclick="setMode('inverted')">Portale Inverso</button>
            <button class="filter-btn" onclick="setMode('neon')">Neon Cyber</button>
        </div>
    </div>

    <div id="countdown-overlay">3</div>
    <div id="flash-overlay"></div>

    <video class="input_video" autoplay playsinline muted></video>
    <canvas id="output_canvas"></canvas>

    <script>
        const videoElement = document.querySelector('.input_video');
        const canvasElement = document.getElementById('output_canvas');
        const canvasCtx = canvasElement.getContext('2d');
        const countdownEl = document.getElementById('countdown-overlay');
        const flashEl = document.getElementById('flash-overlay');

        let currentMode = 'portal';
        let isCountingDown = false;
        let lastLatestResults = null; // Memorizza l'ultimo frame per l'alta risoluzione

        function setMode(mode) {
            currentMode = mode;
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            let desc = mode === 'portal' ? 'Finestra Colore' : (mode === 'inverted' ? 'Portale Inverso' : 'Neon Cyber');
        }

        function resizeCanvas() {
            // Impostiamo la risoluzione interna del canvas a una definizione alta (es. 1920x1080 o dimensioni native video)
            canvasElement.width = window.innerWidth * window.devicePixelRatio;
            canvasElement.height = window.innerHeight * window.devicePixelRatio;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function triggerCapture() {
            if (isCountingDown) return;
            isCountingDown = true;
            
            let count = 3;
            countdownEl.style.display = 'block';
            countdownEl.innerText = count;
            document.getElementById('status-text').innerHTML = `STATO: <span style="color: #ff007f;">ATTendi (${count})...</span>`;

            let timer = setInterval(() => {
                count--;
                if (count > 0) {
                    countdownEl.innerText = count;
                    document.getElementById('status-text').innerHTML = `STATO: <span style="color: #ff007f;">ATTendi (${count})...</span>`;
                } else {
                    clearInterval(timer);
                    countdownEl.style.display = 'none';
                    
                    // Effetto Flash
                    flashEl.style.opacity = '1';
                    setTimeout(() => { flashEl.style.opacity = '0'; }, 300);

                    document.getElementById('status-text').innerHTML = `STATO: <span style="color: #00ffcc;">FOTO SCATTATA!</span>`;

                    // Creazione immagine in alta risoluzione dal canvas principale
                    setTimeout(() => {
                        takeHighResDownload();
                        isCountingDown = false;
                    }, 400);
                }
            }, 1000);
        }

        function takeHighResDownload() {
            // Crea un link temporaneo per il download automatico dell'alta risoluzione
            const link = document.createElement('a');
            link.download = `retrolens-snap-${Date.now()}.png`;
            link.href = canvasElement.toDataURL('image/png', 1.0);
            link.click();
        }

        function onResults(results) {
            lastLatestResults = results;
            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

            if (!results.image) {
                canvasCtx.restore();
                return;
            }

            // Scala il contesto in base al pixel ratio per massima nitidezza
            const scaleX = canvasElement.width;
            const scaleY = canvasElement.height;

            // 1. Sfondo in bianco e nero
            canvasCtx.filter = 'grayscale(100%) contrast(140%) brightness(80%)';
            canvasCtx.drawImage(results.image, 0, 0, scaleX, scaleY);
            canvasCtx.filter = 'none';

            if (results.multiHandLandmarks && results.multiHandLandmarks.length >= 2 && results.multiHandedness) {
                let leftHand = null;
                let rightHand = null;

                for (let i = 0; i < results.multiHandLandmarks.length; i++) {
                    const landmarks = results.multiHandLandmarks[i];
                    const avgX = landmarks.reduce((acc, pt) => acc + pt.x, 0) / landmarks.length;

                    if (avgX < 0.5) {
                        leftHand = landmarks;
                    } else {
                        rightHand = landmarks;
                    }
                }

                if (!leftHand || !rightHand) {
                    leftHand = results.multiHandLandmarks[0];
                    rightHand = results.multiHandLandmarks[1];
                }

                // Controllo distanza pizzico (Indice 8 e Pollice 4) su entrambe le mani
                const distLeft = Math.hypot(leftHand[4].x - leftHand[8].x, leftHand[4].y - leftHand[8].y);
                const distRight = Math.hypot(rightHand[4].x - rightHand[8].x, rightHand[4].y - rightHand[8].y);

                const pinchThreshold = 0.055; // Soglia per considerare il pizzico chiuso
                if (distLeft < pinchThreshold && distRight < pinchThreshold && !isCountingDown) {
                    triggerCapture();
                }

                const l_index = { x: leftHand[8].x * scaleX, y: leftHand[8].y * scaleY };
                const l_thumb = { x: leftHand[4].x * scaleX, y: leftHand[4].y * scaleY };
                const r_index = { x: rightHand[8].x * scaleX, y: rightHand[8].y * scaleY };
                const r_thumb = { x: rightHand[4].x * scaleX, y: rightHand[4].y * scaleY };

                canvasCtx.save();
                canvasCtx.beginPath();
                canvasCtx.moveTo(l_index.x, l_index.y);
                canvasCtx.lineTo(r_index.x, r_index.y);
                canvasCtx.lineTo(r_thumb.x, r_thumb.y);
                canvasCtx.lineTo(l_thumb.x, l_thumb.y);
                canvasCtx.closePath();

                canvasCtx.clip();

                if (currentMode === 'portal') {
                    canvasCtx.filter = 'saturate(180%) contrast(120%)';
                } else if (currentMode === 'inverted') {
                    canvasCtx.filter = 'invert(100%) saturate(200%)';
                } else if (currentMode === 'neon') {
                    canvasCtx.filter = 'hue-rotate(120deg) saturate(300%) contrast(150%)';
                }
                
                canvasCtx.drawImage(results.image, 0, 0, scaleX, scaleY);
                canvasCtx.restore();

                // 3. Cornice wireframe ed evidenziazione collegamenti
                canvasCtx.strokeStyle = (distLeft < pinchThreshold && distRight < pinchThreshold) ? '#ff007f' : '#00ffcc';
                canvasCtx.lineWidth = 4;
                canvasCtx.shadowBlur = 20;
                canvasCtx.shadowColor = canvasCtx.strokeStyle;
                canvasCtx.beginPath();
                canvasCtx.moveTo(l_index.x, l_index.y);
                canvasCtx.lineTo(r_index.x, r_index.y);
                canvasCtx.lineTo(r_thumb.x, r_thumb.y);
                canvasCtx.lineTo(l_thumb.x, l_thumb.y);
                canvasCtx.closePath();
                canvasCtx.stroke();

                canvasCtx.strokeStyle = '#ff007f';
                canvasCtx.lineWidth = 2;
                canvasCtx.beginPath(); canvasCtx.moveTo(l_index.x, l_index.y); canvasCtx.lineTo(r_index.x, r_index.y); canvasCtx.stroke();
                canvasCtx.beginPath(); canvasCtx.moveTo(l_thumb.x, l_thumb.y); canvasCtx.lineTo(r_thumb.x, r_thumb.y); canvasCtx.stroke();
                canvasCtx.beginPath(); canvasCtx.moveTo(l_thumb.x, l_thumb.y); canvasCtx.lineTo(l_index.x, l_index.y); canvasCtx.stroke();
                canvasCtx.beginPath(); canvasCtx.moveTo(r_thumb.x, r_thumb.y); canvasCtx.lineTo(r_index.x, r_index.y); canvasCtx.stroke();

                [leftHand, rightHand].forEach(hand => {
                    drawConnectors(canvasCtx, hand, HAND_CONNECTIONS, {color: 'rgba(0, 255, 204, 0.3)', lineWidth: 1});
                    drawLandmarks(canvasCtx, hand, {color: '#ff007f', lineWidth: 1, radius: 2});
                });

            } else {
                if (!isCountingDown) {
                    document.getElementById('status-text').innerHTML = `STATO: <span style="color: #00ffcc;">AVVICINA LE MANI E FAI IL PIZZICO</span>`;
                }
                canvasCtx.fillStyle = '#00ffcc';
                canvasCtx.font = '16px Courier New';
                canvasCtx.textAlign = 'center';
                canvasCtx.shadowBlur = 10;
                canvasCtx.shadowColor = '#00ffcc';
                canvasCtx.fillText("UNISCI INDICE E POLLICE SU ENTRAMBE LE MANI PER SCATTARE", scaleX / 2, scaleY - 60);
            }

            canvasCtx.restore();
        }

        const hands = new Hands({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
        });

        hands.setOptions({
            maxNumHands: 2,
            modelComplexity: 1,
            minDetectionConfidence: 0.7,
            minTrackingConfidence: 0.7
        });

        hands.onResults(onResults);

        const camera = new Camera(videoElement, {
            onFrame: async () => {
                await hands.send({ image: videoElement });
            },
            width: 1920,
            height: 1080,
            facingMode: 'user'
        });
        camera.start();
    </script>
</body>
</html>

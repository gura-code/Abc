<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gojo Hand Tracking - Infinity & Beyond</title>
    <!-- Importazione librerie MediaPipe -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #05050a;
            color: #00d2ff;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        .hud-panel {
            position: absolute;
            border: 1px solid rgba(0, 210, 255, 0.4);
            background: rgba(5, 5, 10, 0.85);
            padding: 10px 15px;
            font-size: 12px;
            letter-spacing: 1px;
            z-index: 10;
            pointer-events: none;
            box-shadow: 0 0 10px rgba(0, 210, 255, 0.2);
        }

        #top-left { top: 20px; left: 20px; }
        #top-right { top: 20px; right: 20px; text-align: right; }
        
        /* Video webcam in background sfumato */
        .input_video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
            opacity: 0.25;
            z-index: 1;
        }

        #output_canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transform: scaleX(-1);
            z-index: 2;
        }

        /* Sfera di Energia Energetica (Cursed Energy Orb) */
        #energy-orb {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            transform: translate(-50%, -50%) scale(0);
            pointer-events: none;
            z-index: 15;
            transition: all 0.2s ease-out;
            box-shadow: 0 0 30px #00d2ff, inset 0 0 20px #ffffff;
            background: radial-gradient(circle, #ffffff 0%, #00d2ff 60%, #0044ff 100%);
        }

        /* Testo descrittivo della tecnica attiva */
        #technique-display {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 18px;
            letter-spacing: 3px;
            color: #00d2ff;
            text-shadow: 0 0 10px #00d2ff;
            z-index: 20;
            text-align: center;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="top-left" class="hud-panel">
        TECHNIQUE: <span id="tech-name" style="color: #00d2ff;">INFINITY (MUKAGEN)</span><br>
        STATUS: <span id="status-text" style="color: #ff3366;">SEARCHING...</span>
    </div>

    <div id="top-right" class="hud-panel">
        JUJUTSU LEVEL: SPECIAL GRADE<br>
        ENERGY: <span id="energy-level" style="color: #00d2ff;">STABLE</span>
    </div>

    <!-- Sfera di energia evocata -->
    <div id="energy-orb"></div>

    <!-- Nome della tecnica a schermo -->
    <div id="technique-display">MOSTRA LA MANO PER INIZIARE</div>

    <video class="input_video" autoplay playsinline muted></video>
    <canvas id="output_canvas"></canvas>

    <script>
        const videoElement = document.querySelector('.input_video');
        const canvasElement = document.getElementById('output_canvas');
        const canvasCtx = canvasElement.getContext('2d');
        
        const statusText = document.getElementById('status-text');
        const techName = document.getElementById('tech-name');
        const energyLevel = document.getElementById('energy-level');
        const energyOrb = document.getElementById('energy-orb');
        const techniqueDisplay = document.getElementById('technique-display');

        function resizeCanvas() {
            canvasElement.width = window.innerWidth;
            canvasElement.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function onResults(results) {
            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                statusText.innerText = "ACTIVE";
                statusText.style.color = "#00d2ff";

                const landmarks = results.multiHandLandmarks[0];

                // DISEGNO PERSONALIZZATO: Linee azzurre/blu e nodi bianchi (stile Gojo)
                drawConnectors(canvasCtx, landmarks, HAND_CONNECTIONS, {color: 'rgba(0, 210, 255, 0.6)', lineWidth: 3});
                drawLandmarks(canvasCtx, landmarks, {color: '#ffffff', lineWidth: 1, radius: 4});

                const indexFinger = landmarks[8];
                const thumb = landmarks[4];
                const pinky = landmarks[20]; // Usato per calcolare l'apertura totale della mano

                // Coordinate dello schermo basate sull'indice
                const x = (1 - indexFinger.x) * window.innerWidth;
                const y = indexFinger.y * window.innerHeight;

                // Calcolo della distanza tra pollice e indice (Pinch -> Rosso)
                const pinchDistance = Math.hypot(
                    indexFinger.x - thumb.x,
                    indexFinger.y - thumb.y
                );

                // Calcolo della distanza indice-mignolo (Mano aperta vs Chiusa)
                const handSpread = Math.hypot(
                    indexFinger.x - pinky.x,
                    indexFinger.y - pinky.y
                );

                // Posiziona la sfera di energia sul dito indice
                energyOrb.style.left = `${x}px`;
                energyOrb.style.top = `${y}px`;

                if (pinchDistance < 0.05) {
                    // --- TECNICA MALEDETTA: ROSSA (AKA - Aka) ---
                    energyOrb.style.transform = "translate(-50%, -50%) scale(1.5)";
                    energyOrb.style.boxShadow = "0 0 50px #ff0033, inset 0 0 25px #ffffff";
                    energyOrb.style.background = "radial-gradient(circle, #ffffff 0%, #ff0033 60%, #880011 100%)";
                    
                    techName.innerText = "REVERSE CT: RED (AKA)";
                    techName.style.color = "#ff0033";
                    energyLevel.innerText = "REPEL";
                    techniqueDisplay.innerText = "🔴 TECNICA MALEDETTA: ROSSA";
                    techniqueDisplay.style.color = "#ff0033";
                    techniqueDisplay.style.textShadow = "0 0 15px #ff0033";

                } else if (handSpread > 0.35) {
                    // --- TECNICA IMMAGINARIA: VIOLA (Murasaki) - Mano aperta grande ---
                    energyOrb.style.transform = "translate(-50%, -50%) scale(2.8)";
                    energyOrb.style.boxShadow = "0 0 70px #b000ff, inset 0 0 35px #ffffff";
                    energyOrb.style.background = "radial-gradient(circle, #ffffff 0%, #b000ff 50%, #440088 100%)";
                    
                    techName.innerText = "IMAGINARY: PURPLE (MURASAKI)";
                    techName.style.color = "#b000ff";
                    energyLevel.innerText = "MAXIMUM OUTPUT";
                    techniqueDisplay.innerText = "🟣 TECNICA IMMAGINARIA: VIOLA";
                    techniqueDisplay.style.color = "#b000ff";
                    techniqueDisplay.style.textShadow = "0 0 20px #b000ff";

                } else {
                    // --- TECNICA MALEDETTA: BLU (Ao) - Stato standard ---
                    energyOrb.style.transform = "translate(-50%, -50%) scale(1)";
                    energyOrb.style.boxShadow = "0 0 35px #00d2ff, inset 0 0 20px #ffffff";
                    energyOrb.style.background = "radial-gradient(circle, #ffffff 0%, #00d2ff 60%, #0044ff 100%)";
                    
                    techName.innerText = "CURSED TECHNIQUE: BLUE (AO)";
                    techName.style.color = "#00d2ff";
                    energyLevel.innerText = "ATTRACT";
                    techniqueDisplay.innerText = "🔵 TECNICA MALEDETTA: BLU";
                    techniqueDisplay.style.color = "#00d2ff";
                    techniqueDisplay.style.textShadow = "0 0 10px #00d2ff";
                }

            } else {
                statusText.innerText = "LOST";
                statusText.style.color = "#ff3366";
                techName.innerText = "INFINITY (MUKAGEN)";
                energyOrb.style.transform = "translate(-50%, -50%) scale(0)";
                techniqueDisplay.innerText = "MOSTRA LA MANO PER INIZIARE";
                techniqueDisplay.style.color = "#00d2ff";
            }
            canvasCtx.restore();
        }

        const hands = new Hands({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
        });

        hands.setOptions({
            maxNumHands: 1,
            modelComplexity: 1,
            minDetectionConfidence: 0.65,
            minTrackingConfidence: 0.65
        });

        hands.onResults(onResults);

        const camera = new Camera(videoElement, {
            onFrame: async () => {
                await hands.send({ image: videoElement });
            },
            width: 1280,
            height: 720,
            facingMode: 'user'
        });
        camera.start();
    </script>
</body>
</html>

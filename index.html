<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive HUD & Hand Tracking</title>
    <!-- Importazione librerie MediaPipe -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0E0E0E;
            color: #00ffcc;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        .hud-panel {
            position: absolute;
            border: 1px solid rgba(0, 255, 204, 0.3);
            background: rgba(14, 14, 14, 0.8);
            padding: 10px 15px;
            font-size: 12px;
            letter-spacing: 1px;
            z-index: 10;
            pointer-events: none;
        }

        #top-left { top: 20px; left: 20px; }
        #top-right { top: 20px; right: 20px; text-align: right; }
        
        /* Video della webcam in background con specchiatura corretta */
        .input_video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
            opacity: 0.3;
            z-index: 1;
        }

        #output_canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transform: scaleX(-1);
            z-index: 2;
        }

        /* Cursore corretto che segue l'indice senza invertirsi */
        #custom-cursor {
            position: absolute;
            width: 24px;
            height: 24px;
            border: 2px solid #00ffcc;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 20;
            transition: background-color 0.1s, transform 0.1s;
            box-shadow: 0 0 10px #00ffcc;
        }

        #custom-cursor.pinched {
            background-color: #ff0055;
            border-color: #ff0055;
            transform: translate(-50%, -50%) scale(0.6);
            box-shadow: 0 0 15px #ff0055;
        }

        /* Box interattivo centrale */
        .interactive-box {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 240px;
            height: 120px;
            border: 1px dashed rgba(0, 255, 204, 0.6);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-size: 13px;
            z-index: 5;
            background: rgba(0, 255, 204, 0.05);
            pointer-events: none;
            transition: all 0.3s ease;
        }

        /* Pannello segreto che si sblocca dopo il click */
        #secret-panel {
            position: absolute;
            top: 65%;
            left: 50%;
            transform: translateX(-50%);
            width: 300px;
            padding: 15px;
            border: 1px solid #ff0055;
            background: rgba(255, 0, 85, 0.1);
            color: #ff0055;
            font-size: 12px;
            text-align: center;
            z-index: 5;
            display: none; /* Nascosto finché non fai il pinch */
            box-shadow: 0 0 20px rgba(255, 0, 85, 0.3);
        }
    </style>
</head>
<body>

    <div id="top-left" class="hud-panel">
        SYSTEM: ONLINE<br>
        STATUS: <span id="status-text" style="color: #ff0055;">WAITING FOR HAND...</span>
    </div>

    <div id="top-right" class="hud-panel">
        GESTURE: <span id="gesture-state" style="color: #00ffcc;">IDLE</span><br>
        COORD_X: <span id="coord-x">0</span> | COORD_Y: <span id="coord-y">0</span>
    </div>

    <!-- Box interattivo -->
    <div class="interactive-box" id="target-box">
        TARGET ZONE<br><br>[ PINCH TO UNLOCK ]
    </div>

    <!-- Pannello che appare dopo l'interazione -->
    <div id="secret-panel">
        ACCESS GRANTED!<br>
        > PROTOCOL_LOADED: SUCCESS<br>
        > WELCOME TO THE VIBE CODING WORLD
    </div>

    <div id="custom-cursor"></div>

    <video class="input_video" autoplay playsinline muted></video>
    <canvas id="output_canvas"></canvas>

    <script>
        const videoElement = document.querySelector('.input_video');
        const canvasElement = document.getElementById('output_canvas');
        const canvasCtx = canvasElement.getContext('2d');
        const cursor = document.getElementById('custom-cursor');
        
        const statusText = document.getElementById('status-text');
        const gestureState = document.getElementById('gesture-state');
        const coordXText = document.getElementById('coord-x');
        const coordYText = document.getElementById('coord-y');
        const targetBox = document.getElementById('target-box');
        const secretPanel = document.getElementById('secret-panel');

        let isUnlocked = false;

        function resizeCanvas() {
            canvasElement.width = window.innerWidth;
            canvasElement.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function onResults(results) {
            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                statusText.innerText = "HAND DETECTED";
                statusText.style.color = "#00ffcc";

                const landmarks = results.multiHandLandmarks[0];

                // Disegna le lineette della mano
                drawConnectors(canvasCtx, landmarks, HAND_CONNECTIONS, {color: 'rgba(0, 255, 204, 0.6)', lineWidth: 2});
                drawLandmarks(canvasCtx, landmarks, {color: '#ff0055', lineWidth: 1, radius: 3});

                const indexFinger = landmarks[8];
                const thumb = landmarks[4];

                // CORRETTO: Invertito l'asse X (1 - x) per far coincidere il cursore specchiato con il video
                const x = (1 - indexFinger.x) * window.innerWidth;
                const y = indexFinger.y * window.innerHeight;

                coordXText.innerText = Math.round(x);
                coordYText.innerText = Math.round(y);

                // Muovi il cursore
                cursor.style.left = `${x}px`;
                cursor.style.top = `${y}px`;

                // Rilevamento Pinch
                const distance = Math.hypot(
                    indexFinger.x - thumb.x,
                    indexFinger.y - thumb.y
                );

                const boxRect = targetBox.getBoundingClientRect();
                const isInsideBox = (x >= boxRect.left && x <= boxRect.right && y >= boxRect.top && y <= boxRect.bottom);

                if (distance < 0.05) {
                    cursor.classList.add('pinched');
                    gestureState.innerText = "PINCHING";
                    gestureState.style.color = "#ff0055";

                    // Se fai il pinch dentro la target zone, sblocchi il pannello segreto!
                    if (isInsideBox && !isUnlocked) {
                        isUnlocked = true;
                        targetBox.style.backgroundColor = "rgba(255, 0, 85, 0.2)";
                        targetBox.style.borderColor = "#ff0055";
                        targetBox.style.color = "#ff0055";
                        targetBox.innerHTML = "TARGET UNLOCKED<br><br>[ ACCESS ACTIVE ]";
                        secretPanel.style.display = "block"; // Mostra il pannello segreto!
                    }
                } else {
                    cursor.classList.remove('pinched');
                    gestureState.innerText = "TRACKING";
                    gestureState.style.color = "#00ffcc";
                    
                    if (!isUnlocked) {
                        targetBox.style.backgroundColor = "rgba(0, 255, 204, 0.05)";
                        targetBox.style.borderColor = "rgba(0, 255, 204, 0.6)";
                        targetBox.style.color = "#00ffcc";
                    }
                }

            } else {
                statusText.innerText = "WAITING FOR HAND...";
                statusText.style.color = "#ff0055";
                gestureState.innerText = "IDLE";
                coordXText.innerText = "0";
                coordYText.innerText = "0";
            }
            canvasCtx.restore();
        }

        const hands = new Hands({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
        });

        hands.setOptions({
            maxNumHands: 1,
            modelComplexity: 1,
            minDetectionConfidence: 0.6,
            minTrackingConfidence: 0.6
        });

        hands.onResults(onResults);

        const camera = new Camera(videoElement, {
            onFrame: async () => {
                await hands.send({ image: videoElement });
            },
            width: 1280,
            height: 720,
            facingMode: 'user'
        });
        camera.start();
    </script>
</body>
</html>
